<!DOCTYPE html>
<html lang="fa" dir="rtl">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>داشبورد شخصی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--p:#4a6fa5;--pd:#2d4a73;--pl:#c8d8e8;--pll:#e8f0f8;--bg:#f0f4f8;--card:#fff;--bd:#d4dde6;--tx:#2d3748;--mu:#718096;--ok:#48bb78;--wn:#f59e0b}
html,body{direction:rtl;text-align:right}
body{font-family:'Vazirmatn',Tahoma,sans-serif;background:linear-gradient(135deg,#f0f4f8,#e8f0f8);min-height:100vh;padding:20px;color:var(--tx)}
body.en{direction:ltr;text-align:left}
body.en .en-font{font-family:'Times New Roman',serif}
.ctn{max-width:1400px;margin:0 auto}
.hdr{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:24px;margin-bottom:20px;box-shadow:0 2px 8px rgba(74,111,165,.08);border-top:3px solid var(--p)}
.hdr-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px}
.hdr h1{font-size:26px;font-weight:800;color:var(--pd)}
.ls{display:flex;gap:8px}
.lb{padding:8px 18px;border:1px solid var(--bd);background:var(--card);color:var(--p);border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;font-family:inherit}
.lb:hover{background:var(--pll)}
.lb.on{background:var(--p);color:#fff;border-color:var(--p)}
.sts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.sc{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;text-align:center;box-shadow:0 2px 8px rgba(74,111,165,.08);border-top:3px solid var(--p);transition:all .2s}
.sc:hover{transform:translateY(-3px);box-shadow:0 4px 16px rgba(74,111,165,.12)}
.si{font-size:28px;margin-bottom:8px}
.sv{font-size:26px;font-weight:800;color:var(--pd)}
.sl{font-size:12px;color:var(--mu);margin-top:4px;font-weight:600}
.tbs{display:flex;flex-wrap:wrap;gap:8px;background:var(--card);padding:12px;border-radius:12px;margin-bottom:20px;box-shadow:0 2px 8px rgba(74,111,165,.08);border:1px solid var(--bd)}
.tb{padding:8px 16px;border:none;background:transparent;color:var(--mu);border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;font-family:inherit}
.tb:hover{background:var(--pll);color:var(--p)}
.tb.on{background:var(--p);color:#fff}
.sec{display:none}
.sec.on{display:block}
.scd{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:24px;box-shadow:0 2px 8px rgba(74,111,165,.08);margin-bottom:16px}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:12px;border-bottom:2px solid var(--pll)}
.st{font-size:20px;font-weight:800;color:var(--pd)}
.btn{padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
.btn:hover{transform:translateY(-1px)}
.bp{background:var(--p);color:#fff}
.bp:hover{background:var(--pd)}
.bd{background:#a0aec0;color:#fff}
.bw{background:var(--pl);color:var(--pd)}
.bs{padding:5px 10px;font-size:12px}
.itm{background:var(--pll);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:10px;border-right:3px solid var(--p);position:relative}
body.en .itm{border-right:none;border-left:3px solid var(--p)}
.itm:hover{border-color:var(--p);box-shadow:0 2px 8px rgba(74,111,165,.08);background:#fff}
.it{font-weight:700;font-size:15px;margin-bottom:4px;color:var(--tx);display:flex;align-items:center;gap:8px}
.it svg{width:18px;height:18px;fill:var(--p);flex-shrink:0}
.is{font-size:12px;color:var(--mu);margin-bottom:4px}
.id{font-size:13px;color:var(--tx);line-height:1.6;margin-top:6px}
.ia{position:absolute;top:10px;left:10px;display:flex;gap:6px}
body.en .ia{left:auto;right:10px}
.bg{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;margin:2px}
.bgb{background:var(--pll);color:var(--pd)}
.bgg{background:#d4e8d4;color:#2d5a2d}
.bgo{background:#f0e4d4;color:#8b6f47}
.md{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(45,74,115,.6);backdrop-filter:blur(4px);z-index:1000;justify-content:center;align-items:center;padding:20px}
.md.on{display:flex}
.mc{background:var(--card);border-radius:14px;padding:24px;max-width:600px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(45,74,115,.3)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:12px;border-bottom:2px solid var(--pll)}
.mh h3{font-size:18px;font-weight:800;color:var(--pd)}
.cb{background:none;border:none;font-size:24px;cursor:pointer;color:var(--mu)}
.cb:hover{color:var(--pd)}
.fg{margin-bottom:14px}
.fl{display:block;margin-bottom:6px;font-size:13px;font-weight:700;color:var(--pd)}
.fi,.ft,.fs{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;font-size:14px;font-family:inherit;background:var(--pll)}
.fi:focus,.ft:focus,.fs:focus{outline:none;border-color:var(--p);background:var(--card)}
.ft{min-height:80px;resize:vertical}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mf{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:15px;border-top:1px solid var(--bd)}
.em{text-align:center;padding:40px;color:var(--mu);font-size:14px}
.pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px;margin-top:15px}
.pi{background:var(--pll);padding:12px;border-radius:8px;border:1px solid var(--bd)}
.pi label{font-size:11px;color:var(--mu);font-weight:600;display:block;margin-bottom:4px}
.pi .v{font-size:14px;font-weight:600;color:var(--tx)}
.pi .v.e{color:var(--mu);font-style:italic}
.ws{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:15px;padding:12px;background:var(--pll);border-radius:10px;align-items:center}
.wb{padding:6px 14px;border:1px solid var(--bd);background:var(--card);border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
.wb.on{background:var(--p);color:#fff;border-color:var(--p)}
.we{padding:3px 8px;background:var(--pl);border:none;border-radius:6px;cursor:pointer;font-size:11px;font-family:inherit}
.wd{padding:3px 8px;background:#e53e3e;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:11px;font-family:inherit}
.aw{margin-top:10px;padding:8px 16px;background:var(--p);color:#fff;border:none;border-radius:8px;cursor:pointer;font-family:inherit;font-weight:600}
.pt{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
.pt th,.pt td{border:1px solid var(--bd);padding:8px;text-align:right}
body.en .pt th,body.en .pt td{text-align:left}
.pt th{background:var(--p);color:#fff;font-weight:700}
.pt td{background:var(--card)}
.pt input{width:100%;border:none;background:transparent;font-family:inherit;font-size:13px;padding:4px}
.pt input:focus{outline:1px solid var(--p);background:var(--pll)}
.dc{text-align:center;cursor:pointer;font-size:18px}
.dc.ok{color:var(--ok)}
.sst{margin:20px 0 12px;font-size:15px;font-weight:700;color:var(--p);padding-right:10px;border-right:3px solid var(--p);display:flex;justify-content:space-between;align-items:center}
body.en .sst{padding-right:0;padding-left:10px;border-right:none;border-left:3px solid var(--p)}
.pfb{position:fixed;bottom:20px;left:20px;z-index:100;background:var(--p);color:#fff;padding:12px 24px;border-radius:10px;box-shadow:0 4px 16px rgba(74,111,165,.12)}
body.en .pfb{left:auto;right:20px}
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-top:20px}
.chart-card{background:var(--pll);border:1px solid var(--bd);border-radius:12px;padding:20px}
.chart-card h4{font-size:14px;color:var(--pd);margin-bottom:12px;font-weight:700}
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:180px;padding:10px 0}
.bar{flex:1;background:var(--p);border-radius:4px 4px 0 0;min-height:4px;position:relative;transition:all .3s}
.bar:hover{background:var(--pd)}
.bar-label{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--mu);white-space:nowrap}
.bar-value{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--pd)}
.donut{width:150px;height:150px;border-radius:50%;margin:0 auto;position:relative}
.donut-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center}
.donut-center .num{font-size:24px;font-weight:800;color:var(--pd)}
.donut-center .lbl{font-size:11px;color:var(--mu)}
.legend{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:15px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:12px}
.legend-color{width:12px;height:12px;border-radius:3px}
.progress-bar{width:100%;height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--p),var(--ok));transition:width .3s}
@media print{body{background:#fff;padding:0}.tbs,.btn,.ia,.pfb,.md,.ls,.ws,.aw,.we,.wd,.charts-grid{display:none!important}.sec{display:block!important;page-break-inside:avoid;box-shadow:none}.hdr{box-shadow:none}#s7,#s8{display:none!important}}
@media(max-width:768px){.fr{grid-template-columns:1fr}.sts{grid-template-columns:repeat(2,1fr)}.hdr h1{font-size:20px}.pg{grid-template-columns:1fr}}
</style>
</head>

let lang='fa';
let data=null;
let edit={type:null,idx:null};
let currentWeek={meal:0,sport:0};

function init(){
try{
const s=localStorage.getItem('pdV5');
if(s){
const parsed=JSON.parse(s);
data={
fa:mergeDeep(emptyData.fa,parsed.fa||{}),
en:mergeDeep(emptyData.en,parsed.en||{})
};
}else{
data=JSON.parse(JSON.stringify(emptyData));
}
}catch(e){
data=JSON.parse(JSON.stringify(emptyData));
}
render();
}

function mergeDeep(target,source){
const result={...target};
for(const key in source){
if(source[key]&&typeof source[key]==='object'&&!Array.isArray(source[key])){
result[key]=mergeDeep(target[key]||{},source[key]);
}else{
result[key]=source[key];
}
}
return result;
}

function switchLang(l){
lang=l;
document.body.classList.toggle('en',l==='en');
document.documentElement.lang=l;
document.documentElement.dir=l==='fa'?'rtl':'ltr';
render();
}

function save(){
try{localStorage.setItem('pdV5',JSON.stringify(data))}catch(e){}
}

function t(k){
const keys=k.split('.');
let result=T[lang];
for(const key of keys)result=result[key];
return result;
}

function icon(name){return ICONS[name]||''}

function esc(s){
if(!s)return'';
return s.toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function addWeek(type){
const name=prompt(lang==='fa'?'نام هفته (مثلاً: هفته اول مهر):':'Week name (e.g., Week 1 October):');
if(!name)return;
const plan=type==='sport'?data[lang].sportPlan:data[lang].mealPlan;
if(!plan.weeks)plan.weeks=[];
plan.weeks.push({name:name,days:[{},{},{},{},{},{},{}]});
if(type==='sport')currentWeek.sport=plan.weeks.length-1;
else currentWeek.meal=plan.weeks.length-1;
save();render();
}

function editWeekName(type,idx){
const plan=type==='sport'?data[lang].sportPlan:data[lang].mealPlan;
const currentName=plan.weeks[idx].name||'';
const newName=prompt(lang==='fa'?'نام جدید هفته:':'New week name:',currentName);
if(newName!==null&&newName.trim()!==''){
plan.weeks[idx].name=newName.trim();
save();render();
}
}

function deleteWeek(type,idx){
if(!confirm(t('confirm')))return;
const plan=type==='sport'?data[lang].sportPlan:data[lang].mealPlan;
plan.weeks.splice(idx,1);
if(type==='sport'){
if(currentWeek.sport>=plan.weeks.length)currentWeek.sport=Math.max(0,plan.weeks.length-1);
}else{
if(currentWeek.meal>=plan.weeks.length)currentWeek.meal=Math.max(0,plan.weeks.length-1);
}
save();render();
}

function selectWeek(type,idx){
if(type==='sport')currentWeek.sport=idx;
else currentWeek.meal=idx;
render();
}

function updateWeekDay(type,weekIdx,dayIdx,field,value){
const plan=type==='sport'?data[lang].sportPlan:data[lang].mealPlan;
if(!plan.weeks[weekIdx])plan.weeks[weekIdx]={days:[]};
if(!plan.weeks[weekIdx].days[dayIdx])plan.weeks[weekIdx].days[dayIdx]={};
plan.weeks[weekIdx].days[dayIdx][field]=value;
save();
}

function toggleWeekDay(type,weekIdx,dayIdx){
const plan=type==='sport'?data[lang].sportPlan:data[lang].mealPlan;
if(!plan.weeks[weekIdx].days[dayIdx])plan.weeks[weekIdx].days[dayIdx]={};
plan.weeks[weekIdx].days[dayIdx].done=!plan.weeks[weekIdx].days[dayIdx].done;
save();render();
}

function updateMealDay(weekIdx,dayIdx,field,value){
const plan=data[lang].mealPlan;
if(!plan.weeks[weekIdx])plan.weeks[weekIdx]={days:[]};
if(!plan.weeks[weekIdx].days[dayIdx])plan.weeks[weekIdx].days[dayIdx]={};
plan.weeks[weekIdx].days[dayIdx][field]=value;
save();
}

function toggleMealDay(weekIdx,dayIdx){
const plan=data[lang].mealPlan;
if(!plan.weeks[weekIdx].days[dayIdx])plan.weeks[weekIdx].days[dayIdx]={};
plan.weeks[weekIdx].days[dayIdx].done=!plan.weeks[weekIdx].days[dayIdx].done;
save();render();
}

}

let title='';
let body='';

const field=(id,label,type2='text',val='')=>`<div class="fg"><label class="fl">${label}</label><input class="fi" type="${type2}" id="f_${id}" value="${esc(val)}"></div>`;
const select=(id,label,opts,val='')=>`<div class="fg"><label class="fl">${label}</label><select class="fs" id="f_${id}">${opts.map(o=>`<option value="${o.v}" ${o.v===val?'selected':''}>${o.l}</option>`).join('')}</select></div>`;
const textarea=(id,label,val='')=>`<div class="fg"><label class="fl">${label}</label><textarea class="ft" id="f_${id}">${esc(val)}</textarea></div>`;

if(type==='personal'){
title=t('personalTitle');
body=`<div class="fr">${field('name',t('labels').name,item.name)}${field('age',t('labels').age,'number',item.age)}</div>
<div class="fr">${field('gender',t('labels').gender,item.gender)}${field('city',t('labels').city,item.city)}</div>
<div class="fr">${field('phone',t('labels').phone,item.phone)}${field('email',t('labels').email,'email',item.email)}</div>
<div class="fr">${field('linkedin',t('labels').linkedin,item.linkedin)}${field('orcid',t('labels').orcid,item.orcid)}</div>
<div class="fr">${field('university',t('labels').university,item.university)}${field('position',t('labels').position,item.position)}</div>`;
}else if(type==='jobs'){
title=(edit.idx!==null?t('edit'):t('add'))+' - '+t('sections')[1];
body=`<div class="fr">${field('title',t('labels').title,item.title)}${field('company',t('labels').company,item.company)}</div>
<div class="fr">${field('period',t('labels').period,item.period)}${field('duration',t('labels').duration,item.duration)}</div>
<div class="fr">${field('location',t('labels').location,item.location)}${select('type',t('labels').type,[{v:'management',l:t('types').management},{v:'technical',l:t('types').technical}],item.type)}</div>
${textarea('desc',t('labels').desc,item.desc)}`;
}else if(type==='education'){
title=(edit.idx!==null?t('edit'):t('add'))+' - '+t('sections')[2];
body=`<div class="fr">${field('degree',t('labels').degree,item.degree)}${field('field',t('labels').field,item.field)}</div>
<div class="fr">${field('university',t('labels').university,item.university)}${field('gpa',t('labels').gpa,item.gpa)}</div>
<div class="fr">${field('startYear',lang==='fa'?'سال شروع':'Start Year',item.startYear)}${field('endYear',lang==='fa'?'سال پایان':'End Year',item.endYear)}</div>`;
}else if(type==='publications'){
title=(edit.idx!==null?t('edit'):t('add'))+' - '+t('sections')[3];
body=`${field('title',t('labels').title,item.title)}
<div class="fr">${field('journal',t('labels').journal,item.journal)}${select('pubType',t('labels').pubType,[{v:'article',l:t('pubTypes').article},{v:'book',l:t('pubTypes').book},{v:'chapter',l:t('pubTypes').chapter},{v:'conference',l:t('pubTypes').conference}],item.pubType)}</div>
<div class="fr">${select('lang',t('labels').lang,[{v:'fa',l:t('languages').fa},{v:'en',l:t('languages').en},{v:'both',l:t('languages').both}],item.lang)}${field('eduPeriod',t('labels').eduPeriod,item.eduPeriod)}</div>
<div class="fr">${field('submitDate',t('labels').submitDate,'date',item.submitDate)}${field('acceptDate',t('labels').acceptDate,'date',item.acceptDate)}</div>
${textarea('desc',t('labels').desc,item.desc)}`;
}else if(type==='software'){
title=(edit.idx!==null?t('edit'):t('add'))+' - '+t('softwareTitle');
body=`<div class="fr">${field('name',t('labels').name2,item.name)}${select('level',t('labels').level,[{v:'advanced',l:t('levels').advanced},{v:'intermediate',l:t('levels').intermediate},{v:'basic',l:t('levels').basic}],item.level)}</div>`;
}else if(type==='mgmtSkills'){
title=(edit.idx!==null?t('edit'):t('add'))+' - '+t('mgmtTitle');
body=field('skill',t('labels').name2,item.skill);
}else if(type==='techSkills'){
title=(edit.idx!==null?t('edit'):t('add'))+' - '+t('techTitle');
body=field('skill',t('labels').name2,item.skill);
}else if(type==='books'){
title=(edit.idx!==null?t('edit'):t('add'))+' - '+t('sections')[5];
body=`<div class="fr">${field('title',t('labels').title,item.title)}${field('author',t('labels').author,item.author)}</div>
<div class="fr">${field('year',t('labels').year,item.year)}${select('readStatus',t('labels').readStatus,[{v:'planned',l:t('readStatuses').planned},{v:'read',l:t('readStatuses').read}],item.readStatus)}</div>
${field('plannedFor',t('labels').plannedFor,item.plannedFor)}${field('category',t('labels').category,item.category)}
${textarea('notes',t('labels').notes,item.notes)}`;
}else if(type==='podcasts'){
title=(edit.idx!==null?t('edit'):t('add'))+' - '+t('sections')[6];
body=`${field('title',t('labels').title,item.title)}${field('episode',t('labels').episode,item.episode)}
${select('status',t('labels').status,[{v:'planned',l:t('statuses').planned},{v:'progress',l:t('statuses').progress},{v:'done',l:t('statuses').done}],item.status)}
${field('plannedFor',t('labels').plannedFor,item.plannedFor)}
${textarea('notes',t('labels').notes,item.notes)}`;
}else if(type==='projects'){
title=(edit.idx!==null?t('edit'):t('add'))+' - '+t('sections')[9];
body=`<div class="fr">${field('title',t('labels').title,item.title)}${field('year',t('labels').year,item.year)}</div>
${field('category',t('labels').category,item.category)}${select('status',t('labels').status,[{v:'planned',l:t('statuses').planned},{v:'progress',l:t('statuses').progress},{v:'done',l:t('statuses').done}],item.status)}
${textarea('desc',t('labels').desc,item.desc)}`;
}else if(type==='certificates'){
title=(edit.idx!==null?t('edit'):t('add'))+' - '+t('sections')[10];
body=`<div class="fr">${field('name',t('labels').name2,item.name)}${field('issuer',t('labels').issuer,item.issuer)}</div>
<div class="fr">${field('year',t('labels').year,item.year)}${field('duration',t('labels').duration,item.duration)}</div>`;
}else if(type==='goals'){
title=(edit.idx!==null?t('edit'):t('add'))+' - '+t('sections')[11];
body=`${field('target',t('labels').target,item.target)}${field('category',t('labels').category,item.category)}
<div class="fr">${field('deadline',t('labels').deadline,'date',item.deadline)}${select('priority',t('labels').priority,[{v:'high',l:t('priorities').high},{v:'medium',l:t('priorities').medium},{v:'low',l:t('priorities').low}],item.priority)}</div>
${field('progress',t('labels').progress,'number',item.progress||0)}`;
}

document.getElementById('mt').textContent=title;
document.getElementById('mb').innerHTML=body;
document.getElementById('md').classList.add('on');
}

function closeModal(){
document.getElementById('md').classList.remove('on');
}

function saveData(){
const type=edit.type;
const idx=edit.idx;
const d=data[lang];
const get=id=>{
const el=document.getElementById('f_'+id);
return el?el.value:'';
};

try{
if(type==='personal'){
d.personal={
name:get('name'),
age:get('age'),
gender:get('gender'),
city:get('city'),
phone:get('phone'),
email:get('email'),
linkedin:get('linkedin'),
orcid:get('orcid'),
university:get('university'),
position:get('position')
};
}else{
let obj={};
if(type==='jobs')obj={title:get('title'),company:get('company'),period:get('period'),duration:get('duration'),location:get('location'),type:get('type'),desc:get('desc')};
else if(type==='education')obj={degree:get('degree'),field:get('field'),university:get('university'),gpa:get('gpa'),startYear:get('startYear'),endYear:get('endYear')};
else if(type==='publications')obj={title:get('title'),journal:get('journal'),pubType:get('pubType'),lang:get('lang'),eduPeriod:get('eduPeriod'),submitDate:get('submitDate'),acceptDate:get('acceptDate'),desc:get('desc')};
else if(type==='software')obj={name:get('name'),level:get('level')};
else if(type==='mgmtSkills'||type==='techSkills')obj={skill:get('skill')};
else if(type==='books')obj={title:get('title'),author:get('author'),year:get('year'),readStatus:get('readStatus'),plannedFor:get('plannedFor'),category:get('category'),notes:get('notes')};
else if(type==='podcasts')obj={title:get('title'),episode:get('episode'),status:get('status'),plannedFor:get('plannedFor'),notes:get('notes')};
else if(type==='projects')obj={title:get('title'),year:get('year'),category:get('category'),status:get('status'),desc:get('desc')};
else if(type==='certificates')obj={name:get('name'),issuer:get('issuer'),year:get('year'),duration:get('duration')};
else if(type==='goals')obj={target:get('target'),category:get('category'),deadline:get('deadline'),priority:get('priority'),progress:get('progress')};

if(!d[type])d[type]=[];
if(idx!==null&&idx>=0&&idx<d[type].length){
d[type][idx]=obj;
}else{
d[type].push(obj);
}
}

save();
render();
closeModal();
}catch(e){
alert('Error: '+e.message);
console.error(e);
}
}

function del(type,idx){
if(!confirm(t('confirm')))return;
if(!data[lang][type]||!Array.isArray(data[lang][type]))return;
data[lang][type].splice(idx,1);
save();
render();
}

init();
</script>
</body>
</html>
