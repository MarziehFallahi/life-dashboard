<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد شخصی</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #4a6fa5;
            --primary-dark: #2d4a73;
            --primary-light: #c8d8e8;
            --primary-lighter: #e8f0f8;
            --accent: #6b8cae;
            --bg: #f0f4f8;
            --card: #ffffff;
            --border: #d4dde6;
            --text: #2d3748;
            --muted: #718096;
            --shadow: 0 2px 8px rgba(74, 111, 165, 0.08);
            --shadow-md: 0 4px 16px rgba(74, 111, 165, 0.12);
        }
        
        html, body { direction: rtl; text-align: right; }
        
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #e8f0f8 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--text);
            line-height: 1.6;
        }
        
        body.en {
            direction: ltr;
            text-align: left;
            font-family: 'Times New Roman', Times, serif;
        }
        
        body.en .stat-label,
        body.en .tab,
        body.en .btn,
        body.en .section-title,
        body.en .item-title,
        body.en .item-sub,
        body.en .modal-header h3,
        body.en .form-label,
        body.en .header h1,
        body.en .subsection-title {
            font-family: 'Times New Roman', Times, serif;
        }
        
        .container { max-width: 1400px; margin: 0 auto; }
        
        /* Header */
        .header {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border-top: 3px solid var(--primary);
        }
        
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .header h1 {
            font-size: 26px;
            font-weight: 800;
            color: var(--primary-dark);
            letter-spacing: -0.5px;
        }
        
        .lang-switch { display: flex; gap: 8px; }
        
        .lang-btn {
            padding: 8px 18px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--primary);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
            font-family: inherit;
        }
        
        .lang-btn:hover { background: var(--primary-lighter); }
        
        .lang-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        
        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
            text-align: center;
            box-shadow: var(--shadow);
            transition: all 0.2s;
            border-top: 3px solid var(--primary);
        }
        
        .stat-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-md);
            border-top-color: var(--primary-dark);
        }
        
        .stat-icon { 
            width: 32px; 
            height: 32px; 
            margin: 0 auto 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .stat-icon svg {
            width: 28px;
            height: 28px;
            fill: var(--primary);
        }
        
        .stat-value { font-size: 26px; font-weight: 800; color: var(--primary-dark); }
        .stat-label { font-size: 12px; color: var(--muted); margin-top: 4px; font-weight: 600; }
        
        /* Tabs */
        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            background: var(--card);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        
        .tab {
            padding: 8px 16px;
            border: none;
            background: transparent;
            color: var(--muted);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
            font-family: inherit;
        }
        
        .tab:hover { background: var(--primary-lighter); color: var(--primary); }
        
        .tab.active {
            background: var(--primary);
            color: white;
        }
        
        /* Sections */
        .section { display: none; }
        .section.active { display: block; }
        
        .section-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            box-shadow: var(--shadow);
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--primary-lighter);
        }
        
        .section-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--primary-dark);
        }
        
        /* Buttons */
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
        }
        
        .btn:hover { transform: translateY(-1px); }
        
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        
        .btn-primary:hover { background: var(--primary-dark); }
        
        .btn-danger { background: #a0aec0; color: white; }
        .btn-danger:hover { background: #718096; }
        
        .btn-warning { background: var(--primary-light); color: var(--primary-dark); }
        .btn-warning:hover { background: var(--primary); color: white; }
        
        .btn-sm { padding: 5px 10px; font-size: 12px; }
        
        /* Items */
        .item {
            background: var(--primary-lighter);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 10px;
            border-right: 3px solid var(--primary);
            position: relative;
            transition: all 0.2s;
        }
        
        body.en .item { border-right: none; border-left: 3px solid var(--primary); }
        
        .item:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow);
            background: white;
        }
        
        .item-title { 
            font-weight: 700; 
            font-size: 15px; 
            margin-bottom: 4px; 
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .item-title svg {
            width: 18px;
            height: 18px;
            fill: var(--primary);
            flex-shrink: 0;
        }
        
        .item-sub { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
        .item-desc { font-size: 13px; color: var(--text); line-height: 1.6; margin-top: 6px; }
        
        .item-actions {
            position: absolute;
            top: 10px;
            left: 10px;
            display: flex;
            gap: 6px;
        }
        
        body.en .item-actions { left: auto; right: 10px; }
        
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin: 2px;
        }
        
        .badge-blue { background: var(--primary-lighter); color: var(--primary-dark); }
        .badge-green { background: #d4e8d4; color: #2d5a2d; }
        .badge-orange { background: #f0e4d4; color: #8b6f47; }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(45, 74, 115, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .modal.active { display: flex; }
        
        .modal-content {
            background: var(--card);
            border-radius: 14px;
            padding: 24px;
            max-width: 600px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(45, 74, 115, 0.3);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--primary-lighter);
        }
        
        .modal-header h3 { font-size: 18px; font-weight: 800; color: var(--primary-dark); }
        
        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--muted);
        }
        
        .close-btn:hover { color: var(--primary-dark); }
        
        .form-group { margin-bottom: 14px; }
        
        .form-label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 700;
            color: var(--primary-dark);
        }
        
        .form-input, .form-textarea, .form-select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            background: var(--primary-lighter);
            transition: all 0.2s;
        }
        
        .form-input:focus, .form-textarea:focus, .form-select:focus {
            outline: none;
            border-color: var(--primary);
            background: var(--card);
        }
        
        .form-textarea { min-height: 80px; resize: vertical; }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        
        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
        }
        
        .empty {
            text-align: center;
            padding: 40px;
            color: var(--muted);
            font-size: 14px;
        }
        
        .welcome-text {
            color: var(--muted);
            margin-top: 12px;
            line-height: 1.8;
            font-size: 14px;
        }
        
        .subsection-title {
            margin: 20px 0 12px;
            font-size: 15px;
            font-weight: 700;
            color: var(--primary);
            padding-right: 10px;
            border-right: 3px solid var(--primary);
        }
        
        body.en .subsection-title {
            padding-right: 0;
            padding-left: 10px;
            border-right: none;
            border-left: 3px solid var(--primary);
        }
        
        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; }
            .stats { grid-template-columns: repeat(2, 1fr); }
            .header h1 { font-size: 20px; }
        }
    </style>
</head>
<body>
<div class="container" id="app"></div>

<div class="modal" id="modal">

        <div class="modal-header">
            <h3 id="modalTitle"></h3>
            <button class="close-btn" onclick="closeModal()">×</button>
        </div>
        <div id="modalBody"></div>
        <div class="modal-footer">
            <button class="btn btn-primary" onclick="saveData()">ذخیره</button>
            <button class="btn btn-danger" onclick="closeModal()">انصراف</button>
        </div>
    </div>
</div>

const emptyData = {
    fa: { jobs:[], education:[], software:[], mgmtSkills:[], techSkills:[],
        books:[], podcasts:[], sports:[], projects:[], certificates:[],
        goals:[], monthlyPlan:[] },
    en: { jobs:[], education:[], software:[], mgmtSkills:[], techSkills:[],
        books:[], podcasts:[], sports:[], projects:[], certificates:[],
        goals:[], monthlyPlan:[] }
};

let lang = 'fa';
let data = null;
let edit = { type:null, idx:null };

function init() {
    try {
        const s = localStorage.getItem('personalDash');
        data = s ? JSON.parse(s) : JSON.parse(JSON.stringify(emptyData));
    } catch(e) { data = JSON.parse(JSON.stringify(emptyData)); }
    render();
}

function switchLang(l) {
    lang = l;
    document.body.classList.toggle('en', l==='en');
    document.documentElement.lang = l;
    document.documentElement.dir = l==='fa'?'rtl':'ltr';
    render();
}

function save() {
    try { localStorage.setItem('personalDash', JSON.stringify(data)); } catch(e){}
}

function t(k) {
    const ks = k.split('.');
    let r = T[lang];
    for (const k of ks) r = r[k];
    return r;
}

function icon(name) {
    return ICONS[name] || '';
}

    const d = data[lang];
    const counts = [
        d.jobs.length,
        d.education.length,
        d.software.length + d.mgmtSkills.length + d.techSkills.length,
        d.books.length,
        d.podcasts.length,
        d.sports.length,
        d.projects.length,
        d.certificates.length,
        d.goals.length

            </div>
        </div>

                <div class="stat-card">
                    <div class="stat-icon">${icon(t('statIcons')[i])}</div>
                    <div class="stat-value">${c}</div>
                    <div class="stat-label">${t('stats')[i]}</div>
                </div>
            `).join('')}
        </div>
        <div class="tabs">
            ${t('tabs').map((n,i)=>`
                <button class="tab ${i===0?'active':''}" onclick="showTab(${i},this)">${n}</button>
            `).join('')}
        </div>
        <div class="section active" id="s0">
            <div class="section-card">
                <div class="section-title">${t('tabs')[0]}</div>
                <p class="welcome-text">
                    ${lang==='fa'
                        ?'به داشبورد شخصی خوش آمدید. از تب‌های بالا برای مدیریت حوزه‌های مختلف زندگی حرفه‌ای و شخصی خود استفاده کنید.'
                        :'Welcome to your Personal Dashboard. Use the tabs above to manage different areas of your professional and personal life.'}
                </p>
            </div>
        </div>
    `;
    
    html += renderJobs(d);
    html += renderEducation(d);
    html += renderSkills(d);
    html += renderBooks(d);
    html += renderPodcasts(d);

function openModal(type, idx) {
    edit = { type: type, idx: (idx !== undefined ? idx : null) };
    const d = data[lang];
    const L = t('labels');
    const item = (idx !== null && d[type] && d[type][idx]) ? d[type][idx] : {};
    
    let title = '';
    let body = '';
    
    const field = (id, label, type='text', val='') => `<div class="form-group"><label class="form-label">${label}</label><input class="form-input" type="${type}" id="f_${id}" value="${val||''}"></div>`;
    const select = (id, label, opts, val='') => `<div class="form-group"><label class="form-label">${label}</label><select class="form-select" id="f_${id}">${opts.map(o=>`<option value="${o.v}" ${o.v===val?'selected':''}>${o.l}</option>`).join('')}</select></div>`;
    const textarea = (id, label, val='') => `<div class="form-group"><label class="form-label">${label}</label><textarea class="form-textarea" id="f_${id}">${val||''}</textarea></div>`;
    
    if (type==='jobs') {
        title = (idx!==null?t('edit'):t('add')) + ' - ' + t('tabs')[1];
        body = `<div class="form-row">${field('title',L.title,item.title)}${field('company',L.company,item.company)}</div>
            <div class="form-row">${field('period',L.period,item.period)}${field('duration',L.duration,item.duration)}</div>
            <div class="form-row">${field('location',L.location,item.location)}${select('type',L.type,[{v:'management',l:t('types').management},{v:'technical',l:t('types').technical}],item.type)}</div>
            ${textarea('desc',L.desc,item.desc)}`;
    } else if (type==='education') {
        title = (idx!==null?t('edit'):t('add')) + ' - ' + t('tabs')[2];
        body = `<div class="form-row">${field('degree',L.degree,item.degree)}${field('field',L.field,item.field)}</div>
            <div class="form-row">${field('university',L.university,item.university)}${field('gpa',L.gpa,item.gpa)}</div>
            ${field('year',L.year,item.year)}`;
    } else if (type==='software') {
        title = (idx!==null?t('edit'):t('add')) + ' - Software';
        body = `<div class="form-row">${field('name',L.name,item.name)}${select('level',L.level,[{v:t('levels').advanced,l:t('levels').advanced},{v:t('levels').intermediate,l:t('levels').intermediate},{v:t('levels').basic,l:t('levels').basic}],item.level)}</div>`;
    } else if (type==='books') {
        title = (idx!==null?t('edit'):t('add')) + ' - ' + t('tabs')[4];
        body = `<div class="form-row">${field('title',L.title,item.title)}${field('author',L.author,item.author)}</div>
            <div class="form-row">${field('year',L.year,item.year)}${field('rating',L.rating,'number',item.rating)}</div>
            ${field('category',L.category,item.category)}${textarea('notes',L.notes,item.notes)}`;
    } else if (type==='podcasts') {
        title = (idx!==null?t('edit'):t('add')) + ' - ' + t('tabs')[5];
        body = `${field('title',L.title,item.title)}${field('episode',L.episode,item.episode)}${textarea('notes',L.notes,item.notes)}`;
    } else if (type==='sports') {
        title = (idx!==null?t('edit'):t('add')) + ' - ' + t('tabs')[6];
        body = `<div class="form-row">${field('name',L.name,item.name)}${field('frequency',L.frequency,item.frequency)}</div>${textarea('notes',L.notes,item.notes)}`;
    } else if (type==='projects') {
        title = (idx!==null?t('edit'):t('add')) + ' - ' + t('tabs')[7];
        body = `<div class="form-row">${field('title',L.title,item.title)}${field('year',L.year,item.year)}</div>
            ${field('category',L.category,item.category)}${select('status',L.status,[{v:'planned',l:t('statuses').planned},{v:'progress',l:t('statuses').progress},{v:'done',l:t('statuses').done}],item.status)}
            ${textarea('desc',L.desc,item.desc)}`;
    } else if (type==='certificates') {
        title = (idx!==null?t('edit'):t('add')) + ' - ' + t('tabs')[8];
        body = `<div class="form-row">${field('name',L.name,item.name)}${field('issuer',L.issuer,item.issuer)}</div>${field('year',L.year,item.year)}`;
    } else if (type==='goals') {
        title = (idx!==null?t('edit'):t('add')) + ' - ' + t('tabs')[9];
        body = `${field('target',L.target,item.target)}${field('category',L.category,item.category)}
            <div class="form-row">${field('deadline',L.deadline,'date',item.deadline)}${select('priority',L.priority,[{v:'high',l:t('priorities').high},{v:'medium',l:t('priorities').medium},{v:'low',l:t('priorities').low}],item.priority)}</div>`;
    } else if (type==='monthlyPlan') {
        title = (idx!==null?t('edit'):t('add')) + ' - ' + t('tabs')[10];
        body = `${field('title',L.title,item.title)}${field('category',L.category,item.category)}
            ${select('status',L.status,[{v:'planned',l:t('statuses').planned},{v:'progress',l:t('statuses').progress},{v:'done',l:t('statuses').done}],item.status)}
            ${textarea('notes',L.notes,item.notes)}`;
    }
    
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML = body;
    document.getElementById('modal').classList.add('active');
}

function closeModal() { 
    document.getElementById('modal').classList.remove('active'); 
}

function saveData() {
    const type = edit.type;
    const idx = edit.idx;
    const d = data[lang];
    const get = id => {
        const el = document.getElementById('f_'+id);
        return el ? el.value : '';
    };
    
    try {
        let obj = {};
        if (type==='jobs') obj = { title:get('title'), company:get('company'), period:get('period'), duration:get('duration'), location:get('location'), type:get('type'), desc:get('desc') };
        else if (type==='education') obj = { degree:get('degree'), field:get('field'), university:get('university'), gpa:get('gpa'), year:get('year') };
        else if (type==='software') obj = { name:get('name'), level:get('level') };
        else if (type==='books') obj = { title:get('title'), author:get('author'), year:get('year'), rating:get('rating'), category:get('category'), notes:get('notes') };
        else if (type==='podcasts') obj = { title:get('title'), episode:get('episode'), notes:get('notes') };
        else if (type==='sports') obj = { name:get('name'), frequency:get('frequency'), notes:get('notes') };
        else if (type==='projects') obj = { title:get('title'), year:get('year'), category:get('category'), status:get('status'), desc:get('desc') };
        else if (type==='certificates') obj = { name:get('name'), issuer:get('issuer'), year:get('year') };
        else if (type==='goals') obj = { target:get('target'), category:get('category'), deadline:get('deadline'), priority:get('priority') };
        else if (type==='monthlyPlan') obj = { title:get('title'), category:get('category'), status:get('status'), notes:get('notes') };
        
        if (idx!==null) d[type][idx] = obj; else d[type].push(obj);
        save(); 
        render(); 
        closeModal();
    } catch(e) { 
        alert('Error: '+e.message); 
    }
}

function del(type, idx) {
    if (!confirm(t('confirm'))) return;
    data[lang][type].splice(idx,1);
    save(); 
    render();
}
