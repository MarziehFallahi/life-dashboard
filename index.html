<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>داشبورد شخصی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--p:#4a6fa5;--pd:#2d4a73;--pl:#c8d8e8;--pll:#e8f0f8;--bg:#f0f4f8;--card:#fff;--bd:#d4dde6;--tx:#2d3748;--mu:#718096;--ok:#48bb78}
html,body{direction:rtl;text-align:right}
body{font-family:'Vazirmatn',Tahoma,sans-serif;background:linear-gradient(135deg,#f0f4f8,#e8f0f8);min-height:100vh;padding:20px;color:var(--tx)}
body.en{direction:ltr;text-align:left}
body.en .en-font{font-family:'Times New Roman',serif}
.ctn{max-width:1400px;margin:0 auto}
.hdr{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:24px;margin-bottom:20px;box-shadow:0 2px 8px rgba(74,111,165,.08);border-top:3px solid var(--p)}
.hdr-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px}
.hdr h1{font-size:26px;font-weight:800;color:var(--pd)}
.ls{display:flex;gap:8px}
.lb{padding:8px 18px;border:1px solid var(--bd);background:var(--card);color:var(--p);border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;font-family:inherit}
.lb:hover{background:var(--pll)}
.lb.on{background:var(--p);color:#fff;border-color:var(--p)}
.sts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.sc{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:18px;text-align:center;box-shadow:0 2px 8px rgba(74,111,165,.08);border-top:3px solid var(--p);transition:all .2s}
.sc:hover{transform:translateY(-3px);box-shadow:0 4px 16px rgba(74,111,165,.12)}
.si{font-size:28px;margin-bottom:8px}
.sv{font-size:26px;font-weight:800;color:var(--pd)}
.sl{font-size:12px;color:var(--mu);margin-top:4px;font-weight:600}
.tbs{display:flex;flex-wrap:wrap;gap:8px;background:var(--card);padding:12px;border-radius:12px;margin-bottom:20px;box-shadow:0 2px 8px rgba(74,111,165,.08);border:1px solid var(--bd)}
.tb{padding:8px 16px;border:none;background:transparent;color:var(--mu);border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;font-family:inherit}
.tb:hover{background:var(--pll);color:var(--p)}
.tb.on{background:var(--p);color:#fff}
.sec{display:none}
.sec.on{display:block}
.scd{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:24px;box-shadow:0 2px 8px rgba(74,111,165,.08);margin-bottom:16px}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:12px;border-bottom:2px solid var(--pll)}
.st{font-size:20px;font-weight:800;color:var(--pd)}
.btn{padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-weight:600;font-size:13px;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
.btn:hover{transform:translateY(-1px)}
.bp{background:var(--p);color:#fff}
.bp:hover{background:var(--pd)}
.bd{background:#a0aec0;color:#fff}
.bw{background:var(--pl);color:var(--pd)}
.bs{padding:5px 10px;font-size:12px}
.itm{background:var(--pll);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:10px;border-right:3px solid var(--p);position:relative}

.it{font-weight:700;font-size:15px;margin-bottom:4px;color:var(--tx)}
.is{font-size:12px;color:var(--mu);margin-bottom:4px}
.id{font-size:13px;color:var(--tx);line-height:1.6;margin-top:6px}
.ia{position:absolute;top:10px;left:10px;display:flex;gap:6px}
body.en .ia{left:auto;right:10px}
.bg{display:inline-block;padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;margin:2px}

.bgo{background:#f0e4d4;color:#8b6f47}
.md{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(45,74,115,.6);backdrop-filter:blur(4px);z-index:1000;justify-content:center;align-items:center;padding:20px}
.md.on{display:flex}
.mc{background:var(--card);border-radius:14px;padding:24px;max-width:600px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(45,74,115,.3)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:12px;border-bottom:2px solid var(--pll)}

.cb{background:none;border:none;font-size:24px;cursor:pointer;color:var(--mu)}
.cb:hover{color:var(--pd)}
.fg{margin-bottom:14px}
.fl{display:block;margin-bottom:6px;font-size:13px;font-weight:700;color:var(--pd)}
.fi,.ft,.fs{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;font-size:14px;font-family:inherit;background:var(--pll)}
.fi:focus,.ft:focus,.fs:focus{outline:none;border-color:var(--p);background:var(--card)}
.ft{min-height:80px;resize:vertical}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mf{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:15px;border-top:1px solid var(--bd)}
.em{text-align:center;padding:40px;color:var(--mu);font-size:14px}
.pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px;margin-top:15px}
.pi{background:var(--pll);padding:12px;border-radius:8px;border:1px solid var(--bd)}
.pi label{font-size:11px;color:var(--mu);font-weight:600;display:block;margin-bottom:4px}
.pi .v{font-size:14px;font-weight:600;color:var(--tx)}
.pi .v.e{color:var(--mu);font-style:italic}
.ws{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:15px;padding:12px;background:var(--pll);border-radius:10px;align-items:center}
.wb{padding:6px 14px;border:1px solid var(--bd);background:var(--card);border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;font-family:inherit;display:inline-flex;align-items:center;gap:6px}
.wb.on{background:var(--p);color:#fff;border-color:var(--p)}
.we{padding:3px 8px;background:var(--pl);border:none;border-radius:6px;cursor:pointer;font-size:11px;font-family:inherit}
.wd{padding:3px 8px;background:#e53e3e;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:11px;font-family:inherit}
.aw{margin-top:10px;padding:8px 16px;background:var(--p);color:#fff;border:none;border-radius:8px;cursor:pointer;font-family:inherit;font-weight:600}
.pt{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
.pt th,.pt td{border:1px solid var(--bd);padding:8px;text-align:right}
body.en .pt th,body.en .pt td{text-align:left}
.pt th{background:var(--p);color:#fff;font-weight:700}
.pt td{background:var(--card)}
.pt input{width:100%;border:none;background:transparent;font-family:inherit;font-size:13px;padding:4px}
.pt input:focus{outline:1px solid var(--p);background:var(--pll)}
.dc{text-align:center;cursor:pointer;font-size:18px}
.dc.ok{color:var(--ok)}
.sst{margin:20px 0 12px;font-size:15px;font-weight:700;color:var(--p);padding-right:10px;border-right:3px solid var(--p);display:flex;justify-content:space-between;align-items:center}
body.en .sst{padding-right:0;padding-left:10px;border-right:none;border-left:3px solid var(--p)}
.pfb{position:fixed;bottom:20px;left:20px;z-index:100;background:var(--p);color:#fff;padding:12px 24px;border-radius:10px;box-shadow:0 4px 16px rgba(74,111,165,.12)}
body.en .pfb{left:auto;right:20px}
@media print{body{background:#fff;padding:0}.tbs,.btn,.ia,.pfb,.md,.ls,.ws,.aw,.we,.wd{display:none!important}.sec{display:block!important;page-break-inside:avoid;box-shadow:none}.hdr{box-shadow:none}#s7,#s8{display:none!important}}
@media(max-width:768px){.fr{grid-template-columns:1fr}.sts{grid-template-columns:repeat(2,1fr)}.hdr h1{font-size:20px}.pg{grid-template-columns:1fr}}
</style>
</head>
