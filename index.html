<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>داشبورد شخصی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Vazirmatn',Tahoma,sans-serif;background:#f0f4f8;padding:20px;color:#2d3748;min-height:100vh}
body.en{direction:ltr;text-align:left}
.ctn{max-width:1400px;margin:0 auto}
.hdr{background:#fff;border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.1);border-top:3px solid #4a6fa5}
.hdr-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px}
.hdr h1{color:#2d4a73;font-size:24px;font-weight:800}
.ls{display:flex;gap:8px}
.lb{padding:8px 16px;border:1px solid #d4dde6;background:#fff;color:#4a6fa5;border-radius:6px;cursor:pointer;font-weight:600;font-family:'Vazirmatn',sans-serif}
.lb.on{background:#4a6fa5;color:#fff}
.sts{display:grid;grid-template-columns:repeat(9,1fr);gap:8px;margin-bottom:20px}
.sc{background:#fff;border-radius:10px;padding:12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.1);border-top:3px solid #4a6fa5}
.sv{font-size:20px;font-weight:800;color:#2d4a73}
.sl{font-size:10px;color:#718096;margin-top:4px;font-weight:600}
.tbs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;background:#fff;padding:10px;border-radius:10px}
.tb{padding:6px 12px;background:#f8fafc;border:1px solid #d4dde6;border-radius:6px;cursor:pointer;font-weight:600;font-family:'Vazirmatn',sans-serif;font-size:12px}
.tb.on{background:#4a6fa5;color:#fff;border-color:#4a6fa5}
.sec{display:none}
.sec.on{display:block}
.scd{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);margin-bottom:16px}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;padding-bottom:10px;border-bottom:2px solid #e8f0f8}
.st{font-size:18px;font-weight:800;color:#2d4a73}
.btn{padding:8px 14px;border:none;border-radius:6px;cursor:pointer;font-weight:600;font-family:'Vazirmatn',sans-serif;margin:3px}
.bp{background:#4a6fa5;color:#fff}
.bd{background:#e53e3e;color:#fff}
.bw{background:#f59e0b;color:#fff}
.bs{padding:4px 8px;font-size:11px}
.bf{background:#48bb78;color:#fff}

/* ✅ آیتم‌های ردیفی برای متن‌های طولانی */
.itm{background:#f8fafc;padding:12px;margin-bottom:8px;border-radius:8px;border-right:3px solid #4a6fa5;position:relative}
body.en .itm{border-right:none;border-left:3px solid #4a6fa5}
.it{font-weight:700;font-size:14px;margin-bottom:4px}
.is{font-size:12px;color:#718096}
.id{font-size:13px;color:#2d3748;margin-top:6px;line-height:1.5}
.id ul{list-style:none;padding:0;margin:10px 0 0 0}
.id ul li{padding:8px 28px 8px 0;position:relative;line-height:1.8;border-bottom:1px dashed #e8f0f8}
.id ul li:last-child{border-bottom:none}
.id ul li::before{content:'•';position:absolute;right:8px;top:8px;color:#4a6fa5;font-weight:bold;font-size:20px}
body.en .id ul li{padding:8px 0 8px 28px}
body.en .id ul li::before{right:auto;left:8px}
.ia{position:absolute;top:8px;left:8px;display:flex;gap:4px}
body.en .ia{left:auto;right:8px}

/* ✅ آیتم‌های مربعی برای مهارت‌ها، گواهینامه‌ها، کتاب‌ها، پادکست‌ها */
.tag-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:10px}
.tag-item{background:#f8fafc;border:1px solid #d4dde6;border-radius:8px;padding:10px;position:relative;transition:all .2s;display:flex;flex-direction:column;gap:4px}
.tag-item:hover{border-color:#4a6fa5;box-shadow:0 2px 8px rgba(74,111,165,.12);transform:translateY(-2px)}
.tag-title{font-weight:700;font-size:13px;color:#2d3748;line-height:1.4;word-break:break-word}
.tag-sub{font-size:11px;color:#718096}
.tag-badge{font-size:10px;font-weight:600;padding:2px 6px;border-radius:8px;display:inline-block;width:fit-content}
.tag-actions{position:absolute;top:4px;left:4px;display:flex;gap:2px}
body.en .tag-actions{left:auto;right:4px}
.tag-check{position:absolute;top:4px;right:4px;width:20px;height:20px;cursor:pointer;accent-color:#48bb78}
body.en .tag-check{right:auto;left:4px}

.bg{display:inline-block;padding:3px 8px;border-radius:10px;font-size:10px;font-weight:600;margin:2px}
.bgb{background:#e8f0f8;color:#2d4a73}
.bgg{background:#d4e8d4;color:#2d5a2d}
.bgo{background:#f0e4d4;color:#8b6f47}
.bgr{background:#fed7d7;color:#c53030}

.md{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1000;justify-content:center;align-items:center;padding:20px}
.md.on{display:flex}
.mc{background:#fff;padding:25px;border-radius:12px;max-width:600px;width:90%;max-height:85vh;overflow-y:auto}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;padding-bottom:10px;border-bottom:1px solid #e8f0f8}
.mh h3{font-size:16px;color:#2d4a73;font-weight:800}
.cb{background:none;border:none;font-size:20px;cursor:pointer;color:#718096}
.fg{margin-bottom:12px}
.fl{display:block;margin-bottom:5px;font-size:12px;font-weight:700;color:#2d4a73}
.fi,.ft,.fs{width:100%;padding:8px;border:1px solid #d4dde6;border-radius:6px;font-family:'Vazirmatn',sans-serif;font-size:13px}
.ft{min-height:60px;resize:vertical}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mf{display:flex;gap:8px;justify-content:flex-end;margin-top:15px;padding-top:12px;border-top:1px solid #e8f0f8}
.em{text-align:center;padding:30px;color:#718096}
.pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px}
.pi{background:#f8fafc;padding:10px;border-radius:6px}
.pi label{font-size:10px;color:#718096;font-weight:600;display:block}
.pi .v{font-size:13px;font-weight:600;color:#2d3748;margin-top:3px}
.pi .v.e{color:#718096;font-style:italic}
.sst{margin:15px 0 10px;font-size:14px;font-weight:700;color:#4a6fa5;padding-right:8px;border-right:3px solid #4a6fa5;display:flex;justify-content:space-between;align-items:center}
body.en .sst{padding-right:0;padding-left:8px;border-right:none;border-left:3px solid #4a6fa5}
.pfb{position:fixed;bottom:20px;left:20px;z-index:100;background:#4a6fa5;color:#fff;padding:10px 20px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
body.en .pfb{left:auto;right:20px}

/* ✅ چیدمان ۴ هفته در یک ردیف */
.weeks-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:15px}
@media(max-width:1200px){.weeks-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.weeks-grid{grid-template-columns:1fr}}

.week-card{background:#f8fafc;border:1px solid #d4dde6;border-radius:10px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.week-header{background:linear-gradient(135deg,#4a6fa5,#2d4a73);color:#fff;padding:8px 10px;font-size:12px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.week-header .week-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.week-header button{background:rgba(255,255,255,.2);border:none;color:#fff;padding:2px 6px;border-radius:4px;cursor:pointer;font-size:10px;margin-right:3px}
.week-header button:hover{background:rgba(255,255,255,.3)}
.week-header .wd{background:#e53e3e}

.pt{width:100%;border-collapse:collapse;font-size:10px}
.pt th,.pt td{border:1px solid #e2e8f0;padding:3px 4px;text-align:right}
body.en .pt th,body.en .pt td{text-align:left}
.pt th{background:#4a6fa5;color:#fff;font-size:10px;font-weight:700}
.pt td{background:#fff}
.pt input{width:100%;border:none;background:transparent;font-family:'Vazirmatn',sans-serif;font-size:10px;padding:1px}
.pt input:focus{outline:1px solid #4a6fa5;background:#f0f4f8}
.dc{text-align:center;cursor:pointer;font-size:12px}
.dc.ok{color:#48bb78}

.add-weeks-bar{margin-top:15px;padding:12px;background:#f8fafc;border:1px dashed #4a6fa5;border-radius:8px;text-align:center}

.file-list{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.file-item{background:#e8f0f8;padding:4px 8px;border-radius:6px;font-size:11px;display:flex;align-items:center;gap:6px}
.file-item a{color:#4a6fa5;text-decoration:none;font-weight:600}
.file-item a:hover{text-decoration:underline}
.file-remove{color:#e53e3e;cursor:pointer;font-weight:bold}
.file-upload-box{background:#f0f9ff;border:2px dashed #4a6fa5;border-radius:8px;padding:12px;margin-top:10px;text-align:center}
.file-upload-box label{display:block;cursor:pointer;color:#4a6fa5;font-weight:600;font-size:13px}
.file-upload-box input{display:none}
.file-upload-box .hint{font-size:11px;color:#718096;margin-top:4px}

/* ✅ نمودارها - حذف display:none در print */
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:20px}
.chart-card{background:linear-gradient(135deg,#f8fafc,#fff);border:1px solid #d4dde6;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.chart-card h4{font-size:14px;color:#2d4a73;margin-bottom:15px;font-weight:700;text-align:center;padding-bottom:8px;border-bottom:2px solid #e8f0f8}
.chart-wrap{position:relative;height:200px;display:flex;align-items:center;justify-content:center}
.bar-chart{display:flex;align-items:flex-end;gap:10px;height:160px;padding:10px 0 25px 0;border-bottom:2px solid #e8f0f8;width:100%}
.bar{flex:1;background:linear-gradient(180deg,#4a6fa5,#2d4a73);border-radius:4px 4px 0 0;min-height:4px;position:relative;transition:all .3s;cursor:pointer}
.bar:hover{opacity:.8;transform:scaleY(1.05)}
.bar-label{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:9px;color:#718096;white-space:nowrap;max-width:70px;overflow:hidden;text-overflow:ellipsis;text-align:center}
.bar-value{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:#2d4a73}

.resp-list{margin-top:8px}
.resp-item{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.resp-item input{flex:1;padding:8px;border:1px solid #d4dde6;border-radius:6px;font-family:'Vazirmatn',sans-serif;font-size:13px}
.resp-item input:focus{outline:none;border-color:#4a6fa5}
.resp-add{background:#48bb78;color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-family:'Vazirmatn',sans-serif;font-size:12px;font-weight:600;margin-top:4px}
.resp-add:hover{background:#38a169}
.resp-remove{background:#e53e3e;color:#fff;border:none;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:bold}

@media print{
body{background:#fff;padding:0}
.tbs,.btn,.ia,.pfb,.md,.ls,.weeks-grid,.add-weeks-bar,.tag-check{display:none!important}
.sec{display:block!important;page-break-inside:avoid;box-shadow:none}
.hdr{box-shadow:none}
#s6,#s7{display:none!important}
/* ✅ نمودارها در PDF نمایش داده شوند */
.charts-grid{display:grid!important}
.chart-card{break-inside:avoid;page-break-inside:avoid}
}
@media(max-width:1200px){.sts{grid-template-columns:repeat(5,1fr)}}
@media(max-width:768px){.fr{grid-template-columns:1fr}.sts{grid-template-columns:repeat(3,1fr)}.charts-grid{grid-template-columns:1fr}.tag-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}}
</style>
</head>

h+='<td><input type="text" value="'+esc(d.di||'')+'" onchange="umd('+weekIdx+','+i+',\'di\',this.value)"></td>';
h+='<td class="dc '+(d.dn?'ok':'')+'" onclick="tmd('+weekIdx+','+i+')">'+(d.dn?'✓':'○')+'</td></tr>';}
h+='</tbody></table>';return h;
}

function umd(wi,di,f,v){let pl=D[L].mp;if(!pl.w[wi])pl.w[wi]={dy:[]};if(!pl.w[wi].dy[di])pl.w[wi].dy[di]={};pl.w[wi].dy[di][f]=v;sv()}
function tmd(wi,di){let pl=D[L].mp;if(!pl.w[wi].dy[di])pl.w[wi].dy[di]={};pl.w[wi].dy[di].dn=!pl.w[wi].dy[di].dn;sv();r()}

h+='<div class="it"> '+esc(p.ti||'')+'</div><div class="is">'+esc(p.yr||'')+' | '+esc(p.ca||'')+'</div>';

h+=renderFiles(p.files,'pj',oi);h+='</div>';});}
if(planned.length>0){h+='<div class="sst"> '+t('planned')+' ('+planned.length+')</div>';
planned.forEach((p)=>{let oi=d.pj.indexOf(p);
h+='<div class="itm"><div class="ia"><button class="btn bw bs" onclick="om(\'pj\','+oi+')">'+t('e')+'</button><button class="btn bd bs" onclick="dl(\'pj\','+oi+')">'+t('d')+'</button></div>';

function st(i,b){document.querySelectorAll('.sec').forEach(s=>s.classList.remove('on'));document.querySelectorAll('.tb').forEach(b2=>b2.classList.remove('on'));document.getElementById('s'+i).classList.add('on');b.classList.add('on')}

function toggleBook(idx){D[L].bk[idx].rs=D[L].bk[idx].rs==='rd'?'pl2':'rd';sv();r()}
function togglePodcast(idx){let cur=D[L].pd[idx].st;if(cur==='pl')D[L].pd[idx].st='pr2';else if(cur==='pr2')D[L].pd[idx].st='dn';else D[L].pd[idx].st='pl';sv();r()}
function toggleProject(idx){let cur=D[L].pj[idx].st;if(cur==='pl')D[L].pj[idx].st='pr2';else if(cur==='pr2')D[L].pj[idx].st='dn';else D[L].pj[idx].st='pl';sv();r()}
function toggleGoal(idx){D[L].gl[idx].st=D[L].gl[idx].st==='dn'?'pr2':'dn';sv();r()}

function removeFile(type,itemIdx,fileIdx){if(!confirm(t('cf')))return;if(!D[L][type][itemIdx].files)return;D[L][type][itemIdx].files.splice(fileIdx,1);sv();r()}

function handleModalFile(input){if(!input.files||input.files.length===0)return;let file=input.files[0];if(file.size>2*1024*1024){alert('فایل بیش از 2 مگابایت است!');input.value='';return;}let reader=new FileReader();reader.onload=function(e){let fileData={name:file.name,type:file.type,data:e.target.result};pendingFiles.push(fileData);renderFilePreview()};reader.readAsDataURL(file);input.value=''}
function renderFilePreview(){let container=document.getElementById('file-preview');if(!container)return;if(pendingFiles.length===0){container.innerHTML='';return;}let h='<div class="file-list">';pendingFiles.forEach((f,i)=>{h+='<div class="file-item">📎 <a href="'+f.data+'" download="'+esc(f.name)+'">'+esc(f.name)+'</a><span class="file-remove" onclick="removePendingFile('+i+')">×</span></div>'});h+='</div>';container.innerHTML=h}
function removePendingFile(idx){pendingFiles.splice(idx,1);renderFilePreview()}

function om(tp,idx){
ED2={t:tp,i:(idx!==undefined&&idx!==null?idx:null)};
pendingFiles=[];
let d=D[L],it={};
if(tp==='pe')it=d.pe||{};
else if(ED2.i!==null&&Array.isArray(d[tp])&&d[tp][ED2.i])it=d[tp][ED2.i];
if(it.files)pendingFiles=JSON.parse(JSON.stringify(it.files));
let ti='',bd='';
let F=function(id,lb,ty,v){return'<div class="fg"><label class="fl">'+lb+'</label><input class="fi" type="'+(ty||'text')+'" id="f_'+id+'" value="'+esc(v||'')+'"></div>'};
let S=function(id,lb,opts,v){let h='<div class="fg"><label class="fl">'+lb+'</label><select class="fs" id="f_'+id+'">';for(let k=0;k<opts.length;k++)h+='<option value="'+opts[k].v+'" '+(opts[k].v===v?'selected':'')+'>'+opts[k].l+'</option>';h+='</select></div>';return h};
let TA=function(id,lb,v){return'<div class="fg"><label class="fl">'+lb+'</label><textarea class="ft" id="f_'+id+'">'+esc(v||'')+'</textarea></div>'};
let fileUpload='<div class="file-upload-box"><label for="modal-file-input">'+t('lb').addFile+'</label><input type="file" id="modal-file-input" onchange="handleModalFile(this)"><div class="hint">'+t('lb').fileHint+'</div></div><div id="file-preview"></div>';

if(tp==='pe'){ti=t('pi');bd='<div class="fr">'+F('nm',t('lb').nm,it.nm)+F('ag',t('lb').ag,'number',it.ag)+'</div><div class="fr">'+F('gd',t('lb').gd,it.gd)+F('ct',t('lb').ct,it.ct)+'</div><div class="fr">'+F('ph',t('lb').ph,it.ph)+F('em2',t('lb').em2,'email',it.em2)+'</div><div class="fr">'+F('li',t('lb').li,it.li)+F('or',t('lb').or,it.or)+'</div><div class="fr">'+F('un',t('lb').un,it.un)+F('po',t('lb').po,it.po)+'</div>'+fileUpload}
else if(tp==='jb'){ti=(ED2.i!==null?t('e'):t('a'))+' - '+t('sec')[1];
let resps=toRespArray(it.de);let respInputs='';
for(let r=0;r<resps.length;r++){respInputs+='<div class="resp-item"><input type="text" class="resp-input" value="'+esc(resps[r])+'" placeholder="'+(L==='fa'?'مسئولیت یا دستاورد...':'Responsibility...')+'"><button type="button" class="resp-remove" onclick="this.parentElement.remove()">×</button></div>';}
if(resps.length===0){respInputs='<div class="resp-item"><input type="text" class="resp-input" value="" placeholder="'+(L==='fa'?'مسئولیت یا دستاورد...':'Responsibility...')+'"><button type="button" class="resp-remove" onclick="this.parentElement.remove()">×</button></div>';}
bd='<div class="fr">'+F('ti',t('lb').ti,it.ti)+F('co',t('lb').co,it.co)+'</div><div class="fr">'+F('pe',t('lb').pe,it.pe)+F('du',t('lb').du,it.du)+'</div><div class="fr">'+F('lo',t('lb').lo,it.lo)+S('ty',t('lb').ty,[{v:'mg',l:t('tp').mg},{v:'tc',l:t('tp').tc}],it.ty)+'</div>';
bd+='<div class="fg"><label class="fl">'+t('lb').resp+'</label><div class="resp-list" id="resp-list">'+respInputs+'</div><button type="button" class="resp-add" onclick="addRespItem()">'+t('lb').addResp+'</button></div>';
bd+=fileUpload;}
else if(tp==='ed'){ti=(ED2.i!==null?t('e'):t('a'))+' - تحصیل';bd='<div class="fr">'+F('dg',t('lb').dg,it.dg)+F('fi',t('lb').fi,it.fi)+'</div><div class="fr">'+F('un',t('lb').un,it.un)+F('gp',t('lb').gp,it.gp)+'</div><div class="fr">'+F('sy',t('lb').sy,it.sy)+F('ey',t('lb').ey,it.ey)+'</div>'+fileUpload}
else if(tp==='pu'){ti=(ED2.i!==null?t('e'):t('a'))+' - مقاله';bd=F('ti',t('lb').ti,it.ti)+'<div class="fr">'+F('jn',t('lb').jn,it.jn)+S('pt',t('lb').pt,[{v:'ar',l:t('pt2').ar},{v:'bk',l:t('pt2').bk},{v:'ch',l:t('pt2').ch},{v:'cn',l:t('pt2').cn}],it.pt)+'</div><div class="fr">'+S('ln',t('lb').ln,[{v:'fa',l:t('ln2').fa},{v:'en',l:t('ln2').en},{v:'bo',l:t('ln2').bo}],it.ln)+F('ed',t('lb').ed,it.ed)+'</div><div class="fr">'+F('sd',t('lb').sd2,'date',it.sd)+F('ad',t('lb').ad,'date',it.ad)+'</div>'+TA('de',t('lb').de,it.de)+fileUpload}
else if(tp==='sw'){ti=(ED2.i!==null?t('e'):t('a'))+' - '+t('sw');bd='<div class="fr">'+F('nm',t('lb').nm2,it.nm)+S('lv',t('lb').lv,[{v:'ad',l:t('lv').ad},{v:'in',l:t('lv').in},{v:'ba',l:t('lv').ba}],it.lv)+'</div>'+fileUpload}
else if(tp==='ms'){ti=(ED2.i!==null?t('e'):t('a'))+' - '+t('ms');bd=F('sk',t('lb').nm2,it.sk)+fileUpload}
else if(tp==='ts'){ti=(ED2.i!==null?t('e'):t('a'))+' - '+t('ts');bd=F('sk',t('lb').nm2,it.sk)+fileUpload}
else if(tp==='ct'){ti=(ED2.i!==null?t('e'):t('a'))+' - گواهینامه';bd='<div class="fr">'+F('nm',t('lb').nm2,it.nm)+F('is2',t('lb').is2,it.is2)+'</div><div class="fr">'+F('yr',t('lb').yr,it.yr)+F('du',t('lb').du,it.du)+'</div>'+fileUpload}
else if(tp==='bk'){ti=(ED2.i!==null?t('e'):t('a'))+' - '+t('sec')[4];bd='<div class="fr">'+F('ti',t('lb').ti,it.ti)+F('au',t('lb').au,it.au)+'</div><div class="fr">'+F('yr',t('lb').yr,it.yr)+S('rs',t('lb').rs,[{v:'pl2',l:t('rs2').pl2},{v:'rd',l:t('rs2').rd}],it.rs)+'</div>'+F('pf',t('lb').pf,it.pf)+F('ca',t('lb').ca,it.ca)+TA('nt',t('lb').nt,it.nt)+fileUpload}
else if(tp==='pd'){ti=(ED2.i!==null?t('e'):t('a'))+' - '+t('sec')[5];bd=F('ti',t('lb').ti,it.ti)+F('ep',t('lb').ep,it.ep)+S('st',t('lb').st,[{v:'pl',l:t('st2').pl},{v:'pr2',l:t('st2').pr2},{v:'dn',l:t('st2').dn}],it.st)+F('pf',t('lb').pf,it.pf)+TA('nt',t('lb').nt,it.nt)+fileUpload}
else if(tp==='pj'){ti=(ED2.i!==null?t('e'):t('a'))+' - '+t('sec')[8];bd='<div class="fr">'+F('ti',t('lb').ti,it.ti)+F('yr',t('lb').yr,it.yr)+'</div>'+F('ca',t('lb').ca,it.ca)+S('st',t('lb').st,[{v:'pl',l:t('st2').pl},{v:'pr2',l:t('st2').pr2},{v:'dn',l:t('st2').dn}],it.st)+TA('de',t('lb').de,it.de)+fileUpload}
else if(tp==='gl'){ti=(ED2.i!==null?t('e'):t('a'))+' - '+t('sec')[9];bd=F('tg',t('lb').tg,it.tg)+F('ca',t('lb').ca,it.ca)+'<div class="fr">'+F('dl',t('lb').dl,'date',it.dl)+S('pr',t('lb').pr,[{v:'hi',l:t('pr').hi},{v:'me',l:t('pr').me},{v:'lo',l:t('pr').lo}],it.pr)+'</div>'+F('pg',t('lb').pg,'number',it.pg||0)+fileUpload}

document.getElementById('mt').textContent=ti;
document.getElementById('mb').innerHTML=bd;
document.getElementById('md').classList.add('on');
setTimeout(renderFilePreview,50);
}

function addRespItem(){let list=document.getElementById('resp-list');if(!list)return;let div=document.createElement('div');div.className='resp-item';div.innerHTML='<input type="text" class="resp-input" value="" placeholder="'+(L==='fa'?'مسئولیت یا دستاورد...':'Responsibility...')+'"><button type="button" class="resp-remove" onclick="this.parentElement.remove()">×</button>';list.appendChild(div);div.querySelector('input').focus()}
function cm(){document.getElementById('md').classList.remove('on');pendingFiles=[]}

function sd(){
let tp=ED2.t,idx=ED2.i,d=D[L];
let g=function(id){let el=document.getElementById('f_'+id);return el?el.value:''};
try{
if(tp==='pe'){d.pe={nm:g('nm'),ag:g('ag'),gd:g('gd'),ct:g('ct'),ph:g('ph'),em2:g('em2'),li:g('li'),or:g('or'),un:g('un'),po:g('po'),files:pendingFiles.slice()}}
else if(tp==='jb'){let respInputs=document.querySelectorAll('.resp-input');let resps=[];respInputs.forEach(function(inp){let v=inp.value.trim();if(v)resps.push(v)});let o={ti:g('ti'),co:g('co'),pe:g('pe'),du:g('du'),lo:g('lo'),ty:g('ty'),de:resps,files:pendingFiles.slice()};if(!d.jb)d.jb=[];if(idx!==null&&idx>=0&&idx<d.jb.length)d.jb[idx]=o;else d.jb.unshift(o)}
else if(tp==='ed'){let o={dg:g('dg'),fi:g('fi'),un:g('un'),gp:g('gp'),sy:g('sy'),ey:g('ey'),files:pendingFiles.slice()};if(!d.ed)d.ed=[];if(idx!==null&&idx>=0&&idx<d.ed.length)d.ed[idx]=o;else d.ed.unshift(o)}
else if(tp==='pu'){let o={ti:g('ti'),jn:g('jn'),pt:g('pt'),ln:g('ln'),ed:g('ed'),sd:g('sd'),ad:g('ad'),de:g('de'),files:pendingFiles.slice()};if(!d.pu)d.pu=[];if(idx!==null&&idx>=0&&idx<d.pu.length)d.pu[idx]=o;else d.pu.unshift(o)}
else if(tp==='sw'){let o={nm:g('nm'),lv:g('lv'),files:pendingFiles.slice()};if(!d.sw)d.sw=[];if(idx!==null&&idx>=0&&idx<d.sw.length)d.sw[idx]=o;else d.sw.unshift(o)}
else if(tp==='ms'){let o={sk:g('sk'),files:pendingFiles.slice()};if(!d.ms)d.ms=[];if(idx!==null&&idx>=0&&idx<d.ms.length)d.ms[idx]=o;else d.ms.unshift(o)}
else if(tp==='ts'){let o={sk:g('sk'),files:pendingFiles.slice()};if(!d.ts)d.ts=[];if(idx!==null&&idx>=0&&idx<d.ts.length)d.ts[idx]=o;else d.ts.unshift(o)}
else if(tp==='ct'){let o={nm:g('nm'),is2:g('is2'),yr:g('yr'),du:g('du'),files:pendingFiles.slice()};if(!d.ct)d.ct=[];if(idx!==null&&idx>=0&&idx<d.ct.length)d.ct[idx]=o;else d.ct.unshift(o)}
else if(tp==='bk'){let o={ti:g('ti'),au:g('au'),yr:g('yr'),rs:g('rs'),pf:g('pf'),ca:g('ca'),nt:g('nt'),files:pendingFiles.slice()};if(!d.bk)d.bk=[];if(idx!==null&&idx>=0&&idx<d.bk.length)d.bk[idx]=o;else d.bk.unshift(o)}
else if(tp==='pd'){let o={ti:g('ti'),ep:g('ep'),st:g('st'),pf:g('pf'),nt:g('nt'),files:pendingFiles.slice()};if(!d.pd)d.pd=[];if(idx!==null&&idx>=0&&idx<d.pd.length)d.pd[idx]=o;else d.pd.unshift(o)}
else if(tp==='pj'){let o={ti:g('ti'),yr:g('yr'),ca:g('ca'),st:g('st'),de:g('de'),files:pendingFiles.slice()};if(!d.pj)d.pj=[];if(idx!==null&&idx>=0&&idx<d.pj.length)d.pj[idx]=o;else d.pj.unshift(o)}
else if(tp==='gl'){let o={tg:g('tg'),ca:g('ca'),dl:g('dl'),pr:g('pr'),pg:g('pg'),files:pendingFiles.slice()};if(!d.gl)d.gl=[];if(idx!==null&&idx>=0&&idx<d.gl.length)d.gl[idx]=o;else d.gl.unshift(o)}
sv();r();cm();
}catch(e){alert('Error: '+e.message);console.error(e)}
}

function dl(tp,idx){if(!confirm(t('cf')))return;if(!D[L][tp]||!Array.isArray(D[L][tp]))return;D[L][tp].splice(idx,1);sv();r()}

init();
