<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد شخصی</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #4a6fa5;
            --primary-dark: #2d4a73;
            --primary-light: #c8d8e8;
            --primary-lighter: #e8f0f8;
            --accent: #6b8cae;
            --bg: #f0f4f8;
            --card: #ffffff;
            --border: #d4dde6;
            --text: #2d3748;
            --muted: #718096;
            --success: #48bb78;
            --shadow: 0 2px 8px rgba(74, 111, 165, 0.08);
            --shadow-md: 0 4px 16px rgba(74, 111, 165, 0.12);
        }
        
        html, body { direction: rtl; text-align: right; }
        
        body {
            font-family: 'Vazirmatn', Tahoma, sans-serif;
            background: linear-gradient(135deg, #f0f4f8 0%, #e8f0f8 100%);
            min-height: 100vh;
            padding: 20px;
            color: var(--text);
            line-height: 1.6;
        }
        
        body.en {
            direction: ltr;
            text-align: left;
            font-family: 'Times New Roman', Times, serif;
        }
        
        body.en .stat-label, body.en .tab, body.en .btn, body.en .section-title,
        body.en .item-title, body.en .item-sub, body.en .modal-header h3,
        body.en .form-label, body.en .header h1, body.en .subsection-title {
            font-family: 'Times New Roman', Times, serif;
        }
        
        .container { max-width: 1400px; margin: 0 auto; }
        
        .header {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border-top: 3px solid var(--primary);
        }
        
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .header h1 {
            font-size: 26px;
            font-weight: 800;
            color: var(--primary-dark);
        }
        
        .lang-switch { display: flex; gap: 8px; }
        
        .lang-btn {
            padding: 8px 18px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--primary);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
            font-family: inherit;
        }
        
        .lang-btn:hover { background: var(--primary-lighter); }
        .lang-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 18px;
            text-align: center;
            box-shadow: var(--shadow);
            transition: all 0.2s;
            border-top: 3px solid var(--primary);
        }
        
        .stat-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
        
        .stat-icon { width: 32px; height: 32px; margin: 0 auto 8px; display: flex; align-items: center; justify-content: center; }
        .stat-icon svg { width: 28px; height: 28px; fill: var(--primary); }
        .stat-value { font-size: 26px; font-weight: 800; color: var(--primary-dark); }
        .stat-label { font-size: 12px; color: var(--muted); margin-top: 4px; font-weight: 600; }
        
        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            background: var(--card);
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        
        .tab {
            padding: 8px 16px;
            border: none;
            background: transparent;
            color: var(--muted);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
            font-family: inherit;
        }
        
        .tab:hover { background: var(--primary-lighter); color: var(--primary); }
        .tab.active { background: var(--primary); color: white; }
        
        .section { display: none; }
        .section.active { display: block; }
        
        .section-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--primary-lighter);
        }
        
        .section-title { font-size: 20px; font-weight: 800; color: var(--primary-dark); }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
        }
        
        .btn:hover { transform: translateY(-1px); }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-danger { background: #a0aec0; color: white; }
        .btn-danger:hover { background: #718096; }
        .btn-warning { background: var(--primary-light); color: var(--primary-dark); }
        .btn-warning:hover { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-sm { padding: 5px 10px; font-size: 12px; }
        
        .item {
            background: var(--primary-lighter);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 10px;
            border-right: 3px solid var(--primary);
            position: relative;
            transition: all 0.2s;
        }
        
        body.en .item { border-right: none; border-left: 3px solid var(--primary); }
        .item:hover { border-color: var(--primary); box-shadow: var(--shadow); background: white; }
        
        .item-title {
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 4px;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .item-title svg { width: 18px; height: 18px; fill: var(--primary); flex-shrink: 0; }
        .item-sub { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
        .item-desc { font-size: 13px; color: var(--text); line-height: 1.6; margin-top: 6px; }
        
        .item-actions { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; }
        body.en .item-actions { left: auto; right: 10px; }
        
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            margin: 2px;
        }
        
        .badge-blue { background: var(--primary-lighter); color: var(--primary-dark); }
        .badge-green { background: #d4e8d4; color: #2d5a2d; }
        .badge-orange { background: #f0e4d4; color: #8b6f47; }
        
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(45, 74, 115, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .modal.active { display: flex; }
        
        .modal-content {
            background: var(--card);
            border-radius: 14px;
            padding: 24px;
            max-width: 600px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(45, 74, 115, 0.3);
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--primary-lighter);
        }
        
        .modal-header h3 { font-size: 18px; font-weight: 800; color: var(--primary-dark); }
        .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--muted); }
        .close-btn:hover { color: var(--primary-dark); }
        
        .form-group { margin-bottom: 14px; }
        .form-label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 700; color: var(--primary-dark); }
        .form-input, .form-textarea, .form-select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            background: var(--primary-lighter);
            transition: all 0.2s;
        }
        .form-input:focus, .form-textarea:focus, .form-select:focus {
            outline: none; border-color: var(--primary); background: var(--card);
        }
        .form-textarea { min-height: 80px; resize: vertical; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
        }
        
        .empty { text-align: center; padding: 40px; color: var(--muted); font-size: 14px; }
        .welcome-text { color: var(--muted); margin-top: 12px; line-height: 1.8; font-size: 14px; }
        .subsection-title {
            margin: 20px 0 12px;
            font-size: 15px;
            font-weight: 700;
            color: var(--primary);
            padding-right: 10px;
            border-right: 3px solid var(--primary);
        }
        body.en .subsection-title { padding-right: 0; padding-left: 10px; border-right: none; border-left: 3px solid var(--primary); }
        
        /* Personal Info Form */
        .personal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .personal-item {
            background: var(--primary-lighter);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }
        .personal-item label {
            font-size: 11px;
            color: var(--muted);
            font-weight: 600;
            display: block;
            margin-bottom: 4px;
        }
        .personal-item .value {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }
        .personal-item .value.empty { color: var(--muted); font-style: italic; }
        
        /* Charts */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }
        .chart-card {
            background: var(--primary-lighter);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }
        .chart-card h4 {
            font-size: 14px;
            color: var(--primary-dark);
            margin-bottom: 12px;
            font-weight: 700;
        }
        .chart-wrap { position: relative; height: 220px; }
        
        /* Week Selector */
        .week-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
            padding: 12px;
            background: var(--primary-lighter);
            border-radius: 10px;
        }
        .week-btn {
            padding: 6px 14px;
            border: 1px solid var(--border);
            background: var(--card);
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            font-family: inherit;
        }
        .week-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        
        /* Plan Table */
        .plan-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 13px;
        }
        .plan-table th, .plan-table td {
            border: 1px solid var(--border);
            padding: 8px;
            text-align: right;
        }
        body.en .plan-table th, body.en .plan-table td { text-align: left; }
        .plan-table th { background: var(--primary); color: white; font-weight: 700; }
        .plan-table td { background: var(--card); }
        .plan-table input {
            width: 100%;
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 13px;
            padding: 4px;
        }
        .plan-table input:focus { outline: 1px solid var(--primary); background: var(--primary-lighter); }
        .plan-table .done-check { text-align: center; cursor: pointer; font-size: 18px; }
        .plan-table .done-check.checked { color: var(--success); }
        
        .add-week-btn {
            margin-top: 10px;
            padding: 8px 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
        }
        
        /* PDF Button */
        .pdf-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 100;
            background: var(--primary);
            color: white;
            padding: 12px 24px;
            border-radius: 10px;
            box-shadow: var(--shadow-md);
        }
        body.en .pdf-btn { left: auto; right: 20px; }
        
        @media print {
            body { background: white; padding: 0; }
            .tabs, .btn, .item-actions, .pdf-btn, .modal, .lang-switch, .charts-grid, .week-selector, .add-week-btn { display: none !important; }
            .section { display: block !important; page-break-inside: avoid; box-shadow: none; }
            .header { box-shadow: none; }
            #mealPlanSection, #sportPlanSection { display: none !important; }
        }
        
        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; }
            .stats { grid-template-columns: repeat(2, 1fr); }
            .header h1 { font-size: 20px; }
            .personal-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

        if (s) {
            const parsed = JSON.parse(s);
            data = {
                fa: { ...JSON.parse(JSON.stringify(emptyData.fa)), ...(parsed.fa || {}) },
                en: { ...JSON.parse(JSON.stringify(emptyData.en)), ...(parsed.en || {}) }
            };
            // Ensure new fields exist
            if (!data.fa.personal) data.fa.personal = {};
            if (!data.en.personal) data.en.personal = {};
            if (!data.fa.publications) data.fa.publications = [];
            if (!data.en.publications) data.en.publications = [];
            if (!data.fa.mealPlan) data.fa.mealPlan = { weeks: [] };
            if (!data.en.mealPlan) data.en.mealPlan = { weeks: [] };
            if (!data.fa.sportPlan) data.fa.sportPlan = { weeks: [] };
            if (!data.en.sportPlan) data.en.sportPlan = { weeks: [] };
        } else {
            data = JSON.parse(JSON.stringify(emptyData));
        }
    } catch(e) { data = JSON.parse(JSON.stringify(emptyData)); }

}

function switchLang(l) {
    lang = l;
    document.body.classList.toggle('en', l==='en');
    document.documentElement.lang = l;
    document.documentElement.dir = l==='fa'?'rtl':'ltr';
    render();
}

function save() {
    try { localStorage.setItem('personalDashV2', JSON.stringify(data)); } catch(e){}
}

function t(k) {
    const ks = k.split('.');
    let r = T[lang];
    for (const k of ks) r = r[k];

function addWeek(type) {
    const name = prompt(lang==='fa'?'نام هفته (مثلاً: هفته اول مهر):':'Week name (e.g., Week 1 October):');
    if (!name) return;
    const plan = type==='sport'?data[lang].sportPlan:data[lang].mealPlan;
    if (!plan.weeks) plan.weeks = [];
    plan.weeks.push({ name: name, days: [{},{},{},{},{},{},{}] });
    if (type==='sport') currentWeek.sport = plan.weeks.length - 1;
    else currentWeek.meal = plan.weeks.length - 1;
    save(); render();
}

function selectWeek(type, idx) {
    if (type==='sport') currentWeek.sport = idx;
    else currentWeek.meal = idx;
    render();
}

function updateWeekDay(type, weekIdx, dayIdx, field, value) {
    const plan = type==='sport'?data[lang].sportPlan:data[lang].mealPlan;
    if (!plan.weeks[weekIdx]) plan.weeks[weekIdx] = { days: [] };
    if (!plan.weeks[weekIdx].days[dayIdx]) plan.weeks[weekIdx].days[dayIdx] = {};
    plan.weeks[weekIdx].days[dayIdx][field] = value;
    save();
}

function toggleWeekDay(type, weekIdx, dayIdx) {
    const plan = type==='sport'?data[lang].sportPlan:data[lang].mealPlan;
    if (!plan.weeks[weekIdx].days[dayIdx]) plan.weeks[weekIdx].days[dayIdx] = {};
    plan.weeks[weekIdx].days[dayIdx].done = !plan.weeks[weekIdx].days[dayIdx].done;
    save(); render();
}

function updateMealDay(weekIdx, dayIdx, field, value) {
    const plan = data[lang].mealPlan;
    if (!plan.weeks[weekIdx]) plan.weeks[weekIdx] = { days: [] };
    if (!plan.weeks[weekIdx].days[dayIdx]) plan.weeks[weekIdx].days[dayIdx] = {};
    plan.weeks[weekIdx].days[dayIdx][field] = value;
    save();
}

function toggleMealDay(weekIdx, dayIdx) {
    const plan = data[lang].mealPlan;
    if (!plan.weeks[weekIdx].days[dayIdx]) plan.weeks[weekIdx].days[dayIdx] = {};
    plan.weeks[weekIdx].days[dayIdx].done = !plan.weeks[weekIdx].days[dayIdx].done;
    save(); render();
}

        ${d.certificates.length===0?`<div class="empty">${t('empty')}</div>`:
            d.certificates.map((c,i)=>`<div class="item">
                <div class="item-actions">
                    <button class="btn btn-warning btn-sm" onclick="openModal('certificates',${i})">${t('edit')}</button>
                    <button class="btn btn-danger btn-sm" onclick="del('certificates',${i})">${t('delete')}</button>
                </div>
                <div class="item-title">${icon('certificate')} ${c.name||''}</div>
                <div class="item-sub">${c.issuer||''} | ${c.year||''} | ${t('labels').duration}: ${c.duration||''}</div>
            </div>`).join('')}
    </div></div>`;
}

function renderGoals(d) {
    return `<div class="section" id="s11"><div class="section-card">
        <div class="section-header"><div class="section-title">${t('tabs')[11]}</div>
        <button class="btn btn-primary" onclick="openModal('goals')">+ ${t('add')}</button></div>
        ${d.goals.length===0?`<div class="empty">${t('empty')}</div>`:
            d.goals.map((g,i)=>`<div class="item">
                <div class="item-actions">
                    <button class="btn btn-warning btn-sm" onclick="openModal('goals',${i})">${t('edit')}</button>
                    <button class="btn btn-danger btn-sm" onclick="del('goals',${i})">${t('delete')}</button>
                </div>
                <div class="item-title">${icon('goal')} ${g.target||''}</div>
                <div class="item-sub">${g.category||''} | ${g.deadline||''}</div>
                <span class="badge badge-${g.priority==='high'?'orange':g.priority==='medium'?'blue':'green'}">${t('priorities')[g.priority]||g.priority}</span>
            </div>`).join('')}
    </div></div>`;
}

function drawCharts() {
    Object.values(charts).forEach(c=>{if(c)c.destroy();});
    charts = {};
    const d = data[lang];
    const colors = { primary:'#4a6fa5', dark:'#2d4a73', light:'#c8d8e8', success:'#48bb78', warning:'#f59e0b', muted:'#94a3b8' };
    const font = lang==='fa'?'Vazirmatn, Tahoma':'Times New Roman, serif';
    
    // Chart 1: Overall Progress
    const c1 = document.getElementById('chart1');
    if (c1) {
        charts.c1 = new Chart(c1, {
            type: 'radar',
            data: {
                labels: t('stats'),
                datasets: [{
                    data: [
                        Math.min(d.jobs.length*10,100),
                        Math.min(d.education.length*20,100),
                        Math.min(d.publications.length*10,100),
                        Math.min((d.software.length+d.mgmtSkills.length+d.techSkills.length)*5,100),
                        Math.min(d.books.length*5,100),
                        Math.min(d.podcasts.length*10,100),
                        Math.min(d.projects.length*10,100),
                        Math.min(d.certificates.length*10,100),
                        d.goals.length>0?d.goals.reduce((s,g)=>s+(parseInt(g.progress)||0),0)/d.goals.length:0
                    ],
                    backgroundColor: 'rgba(74,111,165,0.2)',
                    borderColor: colors.primary,
                    borderWidth: 2,
                    pointBackgroundColor: colors.primary
                }]
            },
            options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{labels:{font:{family:font,size:11}}}}, scales:{r:{beginAtZero:true,max:100,ticks:{font:{family:font,size:10}},pointLabels:{font:{family:font,size:11}}}}}
        });
    }
    
    // Chart 2: Skills Distribution
    const c2 = document.getElementById('chart2');
    if (c2) {
        const adv = d.software.filter(s=>s.level===t('levels').advanced).length;
        const mid = d.software.filter(s=>s.level===t('levels').intermediate).length;
        const bas = d.software.filter(s=>s.level===t('levels').basic).length;
        charts.c2 = new Chart(c2, {
            type: 'doughnut',
            data: {
                labels: [t('levels').advanced, t('levels').intermediate, t('levels').basic],
                datasets: [{ data:[adv,mid,bas], backgroundColor:[colors.success,colors.warning,colors.muted], borderWidth:0 }]
            },
            options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom',labels:{font:{family:font,size:11}}}}}
        });
    }
    
    // Chart 3: Publications by Type
    const c3 = document.getElementById('chart3');
    if (c3) {
        const types = Object.keys(t('pubTypes'));
        const counts = types.map(tp=>d.publications.filter(p=>p.pubType===tp).length);
        charts.c3 = new Chart(c3, {
            type: 'bar',
            data: {
                labels: types.map(tp=>t('pubTypes')[tp]),
                datasets: [{ label:lang==='fa'?'تعداد':'Count', data:counts, backgroundColor:colors.primary, borderRadius:6 }]
            },
            options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{labels:{font:{family:font,size:11}}}}, scales:{x:{ticks:{font:{family:font,size:11}}},y:{beginAtZero:true,ticks:{stepSize:1,font:{family:font,size:11}}}}}
        });
    }
    
    // Chart 4: Goals Status
    const c4 = document.getElementById('chart4');
    if (c4) {
        const done = d.goals.filter(g=>g.status==='done').length;
        const progress = d.goals.filter(g=>g.status==='progress').length;
        const planned = d.goals.filter(g=>g.status==='planned').length;
        charts.c4 = new Chart(c4, {
            type: 'pie',
            data: {
                labels: [t('statuses').done, t('statuses').progress, t('statuses').planned],
                datasets: [{ data:[done,progress,planned], backgroundColor:[colors.success,colors.warning,colors.muted], borderWidth:0 }]
            },
            options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom',labels:{font:{family:font,size:11}}}}}
        });
    }
}

function showTab(i, btn) {
    document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
    document.getElementById('s'+i).classList.add('active');
    btn.classList.add('active');
    if (i===0) setTimeout(drawCharts, 100);
}

function openModal(type, idx) {
    edit = { type: type, idx: (idx !== undefined && idx !== null ? idx : null) };
    const d = data[lang];
    const L = t('labels');
    
    // Safe item retrieval
    let item = {};
    if (edit.idx !== null && d[type] && Array.isArray(d[type]) && d[type][edit.idx]) {
        item = d[type][edit.idx];
    } else if (type === 'personal') {
        item = d.personal || {};
    }
    
    let title = '';
    let body = '';
    
    const field = (id, label, type='text', val='') => `<div class="form-group"><label class="form-label">${label}</label><input class="form-input" type="${type}" id="f_${id}" value="${(val||'').toString().replace(/"/g,'&quot;')}"></div>`;
    const select = (id, label, opts, val='') => `<div class="form-group"><label class="form-label">${label}</label><select class="form-select" id="f_${id}">${opts.map(o=>`<option value="${o.v}" ${o.v===val?'selected':''}>${o.l}</option>`).join('')}</select></div>`;
    const textarea = (id, label, val='') => `<div class="form-group"><label class="form-label">${label}</label><textarea class="form-textarea" id="f_${id}">${(val||'').toString().replace(/</g,'&lt;')}</textarea></div>`;
    
    if (type==='personal') {
        title = t('personalTitle');
        body = `<div class="form-row">${field('name',L.name,item.name)}${field('age',L.age,'number',item.age)}</div>
            <div class="form-row">${field('gender',L.gender,item.gender)}${field('city',L.city,item.city)}</div>
            <div class="form-row">${field('phone',L.phone,item.phone)}${field('email',L.email,'email',item.email)}</div>
            <div class="form-row">${field('linkedin',L.linkedin,item.linkedin)}${field('orcid',L.orcid,item.orcid)}</div>
            <div class="form-row">${field('university',L.university,item.university)}${field('position',L.position,item.position)}</div>`;
    } else if (type==='jobs') {
        title = (edit.idx!==null?t('edit'):t('add')) + ' - ' + t('tabs')[1];
        body = `<div class="form-row">${field('title',L.title,item.title)}${field('company',L.company,item.company)}</div>
            <div class="form-row">${field('period',L.period,item.period)}${field('duration',L.duration,item.duration)}</div>
            <div class="form-row">${field('location',L.location,item.location)}${select('type',L.type,[{v:'management',l:t('types').management},{v:'technical',l:t('types').technical}],item.type)}</div>
            ${textarea('desc',L.desc,item.desc)}`;
    } else if (type==='education') {
        title = (edit.idx!==null?t('edit'):t('add')) + ' - ' + t('tabs')[2];
        body = `<div class="form-row">${field('degree',L.degree,item.degree)}${field('field',L.field,item.field)}</div>
            <div class="form-row">${field('university',L.university,item.university)}${field('gpa',L.gpa,item.gpa)}</div>
            <div class="form-row">${field('startYear',lang==='fa'?'سال شروع':'Start Year',item.startYear)}${field('endYear',lang==='fa'?'سال پایان':'End Year',item.endYear)}</div>`;
    } else if (type==='publications') {
        title = (edit.idx!==null?t('edit'):t('add')) + ' - ' + t('tabs')[3];
        body = `${field('title',L.title,item.title)}
            <div class="form-row">${field('journal',L.journal,item.journal)}${select('pubType',L.pubType,Object.keys(t('pubTypes')).map(k=>({v:k,l:t('pubTypes')[k]})),item.pubType)}</div>
            <div class="form-row">${select('lang',L.lang,Object.keys(t('languages')).map(k=>({v:k,l:t('languages')[k]})),item.lang)}${field('eduPeriod',L.eduPeriod,item.eduPeriod)}</div>
            <div class="form-row">${field('submitDate',L.submitDate,'date',item.submitDate)}${field('acceptDate',L.acceptDate,'date',item.acceptDate)}</div>
            ${textarea('desc',L.desc,item.desc)}`;
    } else if (type==='software') {
        title = (edit.idx!==null?t('edit'):t('add')) + ' - Software';
        body = `<div class="form-row">${field('name',L.name2,item.name)}${select('level',L.level,[{v:t('levels').advanced,l:t('levels').advanced},{v:t('levels').intermediate,l:t('levels').intermediate},{v:t('levels').basic,l:t('levels').basic}],item.level)}</div>`;
    } else if (type==='mgmtSkills' || type==='techSkills') {
        title = (edit.idx!==null?t('edit'):t('add')) + ' - ' + (type==='mgmtSkills'?t('mgmtTitle'):t('techTitle'));
        body = field('skill',t('labels').name2,item.skill);
    } else if (type==='books') {
        title = (edit.idx!==null?t('edit'):t('add')) + ' - ' + t('tabs')[5];
        body = `<div class="form-row">${field('title',L.title,item.title)}${field('author',L.author,item.author)}</div>
            <div class="form-row">${field('year',L.year,item.year)}${field('rating',L.rating,'number',item.rating)}</div>
            ${field('category',L.category,item.category)}${textarea('notes',L.notes,item.notes)}`;
    } else if (type==='podcasts') {
        title = (edit.idx!==null?t('edit'):t('add')) + ' - ' + t('tabs')[6];
        body = `${field('title',L.title,item.title)}${field('episode',L.episode,item.episode)}${textarea('notes',L.notes,item.notes)}`;
    } else if (type==='projects') {
        title = (edit.idx!==null?t('edit'):t('add')) + ' - ' + t('tabs')[9];
        body = `<div class="form-row">${field('title',L.title,item.title)}${field('year',L.year,item.year)}</div>
            ${field('category',L.category,item.category)}${select('status',L.status,[{v:'planned',l:t('statuses').planned},{v:'progress',l:t('statuses').progress},{v:'done',l:t('statuses').done}],item.status)}
            ${textarea('desc',L.desc,item.desc)}`;
    } else if (type==='certificates') {
        title = (edit.idx!==null?t('edit'):t('add')) + ' - ' + t('tabs')[10];
        body = `<div class="form-row">${field('name',L.name2,item.name)}${field('issuer',L.issuer,item.issuer)}</div>
            <div class="form-row">${field('year',L.year,item.year)}${field('duration',L.duration,item.duration)}</div>`;
    } else if (type==='goals') {
        title = (edit.idx!==null?t('edit'):t('add')) + ' - ' + t('tabs')[11];
        body = `${field('target',L.target,item.target)}${field('category',L.category,item.category)}
            <div class="form-row">${field('deadline',L.deadline,'date',item.deadline)}${select('priority',L.priority,[{v:'high',l:t('priorities').high},{v:'medium',l:t('priorities').medium},{v:'low',l:t('priorities').low}],item.priority)}</div>
            ${field('progress',L.progress,'number',item.progress||0)}`;
    }
    
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML = body;
    document.getElementById('modal').classList.add('active');
}

function closeModal() { 
    document.getElementById('modal').classList.remove('active'); 
}

function saveData() {
    const type = edit.type;
    const idx = edit.idx;
    const d = data[lang];
    const get = id => {
        const el = document.getElementById('f_'+id);
        return el ? el.value : '';
    };
    
    try {
        if (type==='personal') {
            d.personal = {
                name: get('name'), age: get('age'), gender: get('gender'),
                city: get('city'), phone: get('phone'), email: get('email'),
                linkedin: get('linkedin'), orcid: get('orcid'),
                university: get('university'), position: get('position')
            };
        } else {
            let obj = {};
            if (type==='jobs') obj = { title:get('title'), company:get('company'), period:get('period'), duration:get('duration'), location:get('location'), type:get('type'), desc:get('desc') };
            else if (type==='education') obj = { degree:get('degree'), field:get('field'), university:get('university'), gpa:get('gpa'), startYear:get('startYear'), endYear:get('endYear') };
            else if (type==='publications') obj = { title:get('title'), journal:get('journal'), pubType:get('pubType'), lang:get('lang'), eduPeriod:get('eduPeriod'), submitDate:get('submitDate'), acceptDate:get('acceptDate'), desc:get('desc') };
            else if (type==='software') obj = { name:get('name'), level:get('level') };
            else if (type==='mgmtSkills' || type==='techSkills') obj = { skill:get('skill') };
            else if (type==='books') obj = { title:get('title'), author:get('author'), year:get('year'), rating:get('rating'), category:get('category'), notes:get('notes') };
            else if (type==='podcasts') obj = { title:get('title'), episode:get('episode'), notes:get('notes') };
            else if (type==='projects') obj = { title:get('title'), year:get('year'), category:get('category'), status:get('status'), desc:get('desc') };
            else if (type==='certificates') obj = { name:get('name'), issuer:get('issuer'), year:get('year'), duration:get('duration') };
            else if (type==='goals') obj = { target:get('target'), category:get('category'), deadline:get('deadline'), priority:get('priority'), progress:get('progress') };
            
            if (!d[type]) d[type] = [];
            if (idx!==null) d[type][idx] = obj; else d[type].push(obj);
        }
        
        save(); 
        render(); 
        closeModal();
    } catch(e) { 
        alert('Error: '+e.message); 
        console.error(e);
    }
}

function del(type, idx) {
    if (!confirm(t('confirm'))) return;
    data[lang][type].splice(idx,1);
    save(); 
    render();
}

init();
</script>
