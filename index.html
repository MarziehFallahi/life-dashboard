<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>داشبورد شخصی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Vazirmatn',Tahoma,sans-serif;background:#f0f4f8;padding:20px;color:#2d3748;min-height:100vh}
body.en{direction:ltr;text-align:left}
.ctn{max-width:1400px;margin:0 auto}
.hdr{background:#fff;border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,.1);border-top:3px solid #4a6fa5}
.hdr-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:15px}
.hdr h1{color:#2d4a73;font-size:24px;font-weight:800}
.ls{display:flex;gap:8px;align-items:center}
.lb{padding:8px 16px;border:1px solid #d4dde6;background:#fff;color:#4a6fa5;border-radius:6px;cursor:pointer;font-weight:600;font-family:'Vazirmatn',sans-serif;text-decoration:none;font-size:13px}
.lb.on{background:#4a6fa5;color:#fff}
.sts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.sc{background:#fff;border-radius:10px;padding:16px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.1);border-top:3px solid #4a6fa5;transition:all .2s}
.sc:hover{transform:translateY(-3px);box-shadow:0 4px 16px rgba(74,111,165,.15)}
.sc-icon{font-size:28px;margin-bottom:6px}
.sv{font-size:22px;font-weight:800;color:#2d4a73}
.sl{font-size:11px;color:#718096;margin-top:4px;font-weight:600}
.tbs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;background:#fff;padding:10px;border-radius:10px}
.tb{padding:8px 14px;background:#f8fafc;border:1px solid #d4dde6;border-radius:6px;cursor:pointer;font-weight:600;font-family:'Vazirmatn',sans-serif;font-size:13px}
.tb.on{background:#4a6fa5;color:#fff;border-color:#4a6fa5}
.sec{display:none}
.sec.on{display:block}
.scd{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);margin-bottom:16px}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;padding-bottom:10px;border-bottom:2px solid #e8f0f8}
.st-title{font-size:18px;font-weight:800;color:#2d4a73}
.btn{padding:8px 14px;border:none;border-radius:6px;cursor:pointer;font-weight:600;font-family:'Vazirmatn',sans-serif;margin:3px;text-decoration:none;display:inline-block;font-size:13px}
.bp{background:#4a6fa5;color:#fff}
.bd{background:#e53e3e;color:#fff}
.bw{background:#f59e0b;color:#fff}
.bs{padding:4px 8px;font-size:11px}
.bf{background:#48bb78;color:#fff}
.itm{background:#f8fafc;padding:14px;margin-bottom:10px;border-radius:8px;border-right:3px solid #4a6fa5;position:relative}
body.en .itm{border-right:none;border-left:3px solid #4a6fa5}
.it{font-weight:700;font-size:14px;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.it-icon{font-size:16px}
.is{font-size:12px;color:#718096}
.id{font-size:13px;color:#2d3748;margin-top:6px;line-height:1.6}
.id ul{list-style:none;padding:0;margin:10px 0 0 0}
.id ul li{padding:6px 24px 6px 0;position:relative;line-height:1.7;border-bottom:1px dashed #e8f0f8}
.id ul li:last-child{border-bottom:none}
.id ul li::before{content:'•';position:absolute;right:6px;top:6px;color:#4a6fa5;font-weight:bold;font-size:18px}
body.en .id ul li{padding:6px 0 6px 24px}
body.en .id ul li::before{right:auto;left:6px}
.ia{position:absolute;top:10px;left:10px;display:flex;gap:4px}
body.en .ia{left:auto;right:10px}
.tag-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:10px}
.tag-item{background:#f8fafc;border:1px solid #d4dde6;border-radius:8px;padding:12px;position:relative;transition:all .2s;display:flex;flex-direction:column;gap:4px}
.tag-item:hover{border-color:#4a6fa5;box-shadow:0 2px 8px rgba(74,111,165,.12);transform:translateY(-2px)}
.tag-title{font-weight:700;font-size:13px;color:#2d3748;line-height:1.4}
.tag-sub{font-size:11px;color:#718096}
.tag-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:8px;display:inline-block;width:fit-content}
.tag-actions{position:absolute;top:6px;left:6px;display:flex;gap:3px}
body.en .tag-actions{left:auto;right:6px}
.bg{display:inline-block;padding:3px 10px;border-radius:10px;font-size:10px;font-weight:600;margin:2px}
.bgb{background:#e8f0f8;color:#2d4a73}
.bgg{background:#d4e8d4;color:#2d5a2d}
.bgo{background:#f0e4d4;color:#8b6f47}
.bgr{background:#fed7d7;color:#c53030}
.md{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:1000;justify-content:center;align-items:center;padding:20px}
.md.on{display:flex}
.mc{background:#fff;padding:25px;border-radius:12px;max-width:600px;width:90%;max-height:85vh;overflow-y:auto}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;padding-bottom:10px;border-bottom:1px solid #e8f0f8}
.mh h3{font-size:16px;color:#2d4a73;font-weight:800}
.cb{background:none;border:none;font-size:22px;cursor:pointer;color:#718096}
.fg{margin-bottom:12px}
.fl{display:block;margin-bottom:5px;font-size:12px;font-weight:700;color:#2d4a73}
.fi,.ft,.fs{width:100%;padding:10px;border:1px solid #d4dde6;border-radius:6px;font-family:'Vazirmatn',sans-serif;font-size:13px}
.ft{min-height:70px;resize:vertical}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mf{display:flex;gap:8px;justify-content:flex-end;margin-top:15px;padding-top:12px;border-top:1px solid #e8f0f8}
.em{text-align:center;padding:30px;color:#718096}
.pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:10px}
.pi{background:#f8fafc;padding:12px;border-radius:8px}
.pi label{font-size:11px;color:#718096;font-weight:600;display:block}
.pi .v{font-size:14px;font-weight:600;color:#2d3748;margin-top:4px}
.pi .v.e{color:#718096;font-style:italic}
.sst{margin:18px 0 12px;font-size:14px;font-weight:700;color:#4a6fa5;padding-right:10px;border-right:3px solid #4a6fa5;display:flex;justify-content:space-between;align-items:center}
body.en .sst{padding-right:0;padding-left:10px;border-right:none;border-left:3px solid #4a6fa5}
.pfb{position:fixed;bottom:20px;left:20px;z-index:100;background:#4a6fa5;color:#fff;padding:10px 20px;border-radius:8px;box-shadow:0 4px 12px rgba(0,0,0,.2);text-decoration:none}
body.en .pfb{left:auto;right:20px}
.file-list{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.file-item{background:#e8f0f8;padding:4px 8px;border-radius:6px;font-size:11px;display:flex;align-items:center;gap:6px}
.file-item a{color:#4a6fa5;text-decoration:none;font-weight:600}
.file-remove{color:#e53e3e;cursor:pointer;font-weight:bold}
.file-upload-box{background:#f0f9ff;border:2px dashed #4a6fa5;border-radius:8px;padding:12px;margin-top:10px;text-align:center}
.file-upload-box label{display:block;cursor:pointer;color:#4a6fa5;font-weight:600;font-size:13px}
.file-upload-box input{display:none}
.file-upload-box .hint{font-size:11px;color:#718096;margin-top:4px}
.charts-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:20px}
.chart-card{background:linear-gradient(135deg,#f8fafc,#fff);border:1px solid #d4dde6;border-radius:12px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.chart-card h4{font-size:14px;color:#2d4a73;margin-bottom:15px;font-weight:700;text-align:center;padding-bottom:8px;border-bottom:2px solid #e8f0f8}
.chart-wrap{position:relative;height:200px;display:flex;align-items:center;justify-content:center}
.bar-chart{display:flex;align-items:flex-end;gap:12px;height:160px;padding:10px 0 25px 0;border-bottom:2px solid #e8f0f8;width:100%}
.bar{flex:1;background:linear-gradient(180deg,#4a6fa5,#2d4a73);border-radius:4px 4px 0 0;min-height:4px;position:relative;transition:all .3s}
.bar:hover{opacity:.8}
.bar-label{position:absolute;bottom:-22px;left:50%;transform:translateX(-50%);font-size:9px;color:#718096;white-space:nowrap;max-width:80px;overflow:hidden;text-overflow:ellipsis;text-align:center}
.bar-value{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;color:#2d4a73}
.line-chart{width:100%;height:180px;position:relative}
.line-chart svg{width:100%;height:100%}
.resp-list{margin-top:8px}
.resp-item{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.resp-item input{flex:1;padding:8px;border:1px solid #d4dde6;border-radius:6px;font-family:'Vazirmatn',sans-serif;font-size:13px}
.resp-add{background:#48bb78;color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-family:'Vazirmatn',sans-serif;font-size:12px;font-weight:600;margin-top:4px}
.resp-remove{background:#e53e3e;color:#fff;border:none;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:14px;font-weight:bold}

@media print {
  @page { size: A4; margin: 10mm 8mm; }
  body { background: #fff !important; padding: 0 !important; font-size: 9px !important; }
  .tbs, .btn, .ia, .pfb, .md, .ls, .file-upload-box, .resp-add, .resp-remove, .tag-actions, .file-remove { display: none !important; }
  .sec { display: block !important; box-shadow: none !important; margin-bottom: 6px !important; padding: 0 !important; }
  .scd { box-shadow: none !important; border: none !important; padding: 4px 0 !important; margin-bottom: 4px !important; }
  .hdr { box-shadow: none !important; padding: 6px 0 !important; margin-bottom: 6px !important; }
  .sts { grid-template-columns: repeat(4, 1fr) !important; }
  .charts-grid { grid-template-columns: repeat(2, 1fr) !important; }
  .tag-grid { grid-template-columns: repeat(3, 1fr) !important; }
  .itm, .tag-item { page-break-inside: avoid !important; }
}

@media(max-width:768px){.sts{grid-template-columns:repeat(2,1fr)}.fr{grid-template-columns:1fr}.charts-grid{grid-template-columns:1fr}.tag-grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="ctn" id="app"></div>
<div class="md" id="md"><div class="mc"><div class="mh"><h3 id="mt"></h3><button class="cb" onclick="cm()">×</button></div><div id="mb"></div><div class="mf"><button class="btn bp" onclick="sd()">ذخیره</button><button class="btn bd" onclick="cm()">انصراف</button></div></div></div>
<a class="btn pfb" href="plan.html">📋 برنامه‌ریزی</a>

<script>
const T={
fa:{t:'داشبورد شخصی',a:'افزودن',e:'ویرایش',d:'حذف',em:'هنوز موردی نیست.',cf:'مطمئنید؟',
sec:['نمای کلی','مشاغل','آکادمیک','مهارت‌ها و گواهینامه‌ها','پروژه‌ها'],
lb:{nm:'نام',ag:'سن',gd:'جنسیت',ct:'شهر',ph:'تلفن',em2:'ایمیل',li:'لینکدین',or:'ORCID',un:'دانشگاه',po:'پست سازمانی',
ti:'عنوان',co:'شرکت',pe:'دوره',du:'مدت',lo:'مکان',ty:'نوع',de:'توضیحات',dt:'تاریخ',dg:'مقطع',fi:'رشته',gp:'معدل',
yr:'سال',nm2:'نام',lv:'سطح',hr:'ساعت',au:'نویسنده',rt:'امتیاز',nt:'یادداشت',ep:'اپیزود',is2:'صادرکننده',ca:'دسته',
tg:'هدف',dl:'مهلت',pr:'اولویت',pg:'پیشرفت',jn:'ژورنال',ln:'زبان',sd2:'تاریخ شروع',ad:'تاریخ پایان',ed:'دوره تحصیلی',pt:'نوع',
sy:'سال شروع',ey:'سال پایان',startDate:'تاریخ شروع',endDate:'تاریخ پایان',
addResp:'➕ افزودن مسئولیت',resp:'مسئولیت‌ها و دستاوردها',
addFile:'📎 پیوست فایل',fileHint:'حداکثر 2 مگابایت'},
tp:{mg:'مدیریتی',tc:'فنی و مهندسی'},lv:{ad:'پیشرفته',in:'متوسط',ba:'مقدماتی'},
pr:{hi:'بالا',me:'متوسط',lo:'پایین'},
pt2:{ar:'مقاله',bk:'کتاب',cn:'کنفرانس'},
ln2:{fa:'فارسی',en:'انگلیسی',bo:'دوزبانه'},
sw:'نرم‌افزارها',ms:'مهارت مدیریتی',ts:'مهارت فنی و مهندسی',pi:'مشخصات فردی',ac:'آکادمیک',sk:'مهارت‌ها و گواهینامه‌ها',
chartsTitle:' نمودارهای پیشرفت',
skillsDist:'توزیع مهارت‌ها',articlesByType:'مقالات به تفکیک نوع',
projStatus:'وضعیت پروژه‌ها',growthChart:'روند رشد در طول زمان',
advanced:'پیشرفته',intermediate:'متوسط',basic:'مقدماتی',
article:'مقاله',book:'کتاب',conference:'کنفرانس',
done:'انجام شده',inProgress:'در حال انجام',planned:'برنامه‌ریزی',
completed:'تکمیل شده',incomplete:'تکمیل نشده',
planLink:' برنامه‌ریزی',
draftArticles:'مقالات در دست نگارش',publishedArticles:'مقالات منتشر شده'},
en:{t:'Personal Dashboard',a:'Add',e:'Edit',d:'Delete',em:'No items yet.',cf:'Sure?',
sec:['Overview','Jobs','Academic','Skills & Certs','Projects'],
lb:{nm:'Name',ag:'Age',gd:'Gender',ct:'City',ph:'Phone',em2:'Email',li:'LinkedIn',or:'ORCID',un:'University',po:'Position',
ti:'Title',co:'Company',pe:'Period',du:'Duration',lo:'Location',ty:'Type',de:'Description',dt:'Date',dg:'Degree',fi:'Field',gp:'GPA',
yr:'Year',nm2:'Name',lv:'Level',hr:'Hours',au:'Author',rt:'Rating',nt:'Notes',ep:'Episode',is2:'Issuer',ca:'Category',
tg:'Goal',dl:'Deadline',pr:'Priority',pg:'Progress',jn:'Journal',ln:'Language',sd2:'Start Date',ad:'End Date',ed:'Edu Period',pt:'Type',
sy:'Start Year',ey:'End Year',startDate:'Start Date',endDate:'End Date',
addResp:' Add Responsibility',resp:'Responsibilities',
addFile:'📎 Attach File',fileHint:'Max 2MB'},
tp:{mg:'Management',tc:'Technical'},lv:{ad:'Advanced',in:'Intermediate',ba:'Basic'},
pr:{hi:'High',me:'Medium',lo:'Low'},
pt2:{ar:'Article',bk:'Book',cn:'Conference'},
ln2:{fa:'Persian',en:'English',bo:'Bilingual'},
sw:'Software',ms:'Management Skills',ts:'Technical Skills',pi:'Personal Info',ac:'Academic',sk:'Skills & Certificates',
chartsTitle:'📊 Progress Charts',
skillsDist:'Skills Distribution',articlesByType:'Articles by Type',
projStatus:'Projects Status',growthChart:'Growth Over Time',
advanced:'Advanced',intermediate:'Intermediate',basic:'Basic',
article:'Article',book:'Book',conference:'Conference',
done:'Done',inProgress:'In Progress',planned:'Planned',
completed:'Completed',incomplete:'Incomplete',
planLink:'📋 Planning',
draftArticles:'Draft Articles',publishedArticles:'Published Articles'}
};

const ED={fa:{pe:{},jb:[],ed:[],pu:[],puDraft:[],sw:[],ms:[],ts:[],ct:[],pj:[]},
en:{pe:{},jb:[],ed:[],pu:[],puDraft:[],sw:[],ms:[],ts:[],ct:[],pj:[]}};

let L='fa',D=null,ED2={t:null,i:null},pendingFiles=[];

function init(){
try{
let s=localStorage.getItem('dashMainV2');
if(s){
let p=JSON.parse(s);
D={fa:mg(ED.fa,p.fa||{}),en:mg(ED.en,p.en||{})};
// مهاجرت داده‌های قدیمی
if(!D.fa.puDraft)D.fa.puDraft=[];
if(!D.en.puDraft)D.en.puDraft=[];
}else{D=JSON.parse(JSON.stringify(ED))}
}catch(e){D=JSON.parse(JSON.stringify(ED))}
r();
}

function mg(a,b){let r=JSON.parse(JSON.stringify(a));for(let k in b){if(b[k]&&typeof b[k]==='object'&&!Array.isArray(b[k]))r[k]=mg(a[k]||{},b[k]);else r[k]=b[k]}return r}
function sl(l){L=l;document.body.classList.toggle('en',l==='en');document.documentElement.lang=l;document.documentElement.dir=l==='fa'?'rtl':'ltr';r()}
function sv(){try{localStorage.setItem('dashMainV2',JSON.stringify(D))}catch(e){alert('حافظه پر است!')}}
function t(k){
const keys=k.split('.');
let r=T[L];
for(const key of keys)r=r[key];
return r||k;
}
function esc(s){if(!s)return'';return s.toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function toRespArray(de){if(!de)return[];if(Array.isArray(de))return de.filter(x=>x&&x.trim());if(typeof de==='string')return de.split('\n').filter(x=>x&&x.trim());return[]}
function sortByNewest(arr,field){if(!arr||arr.length===0)return[];return arr.slice().sort((a,b)=>{let da=a[field]||'',db=b[field]||'';if(!da&&!db)return 0;if(!da)return 1;if(!db)return -1;return db.localeCompare(da)})}
function sortByOldest(arr,field){if(!arr||arr.length===0)return[];return arr.slice().sort((a,b)=>{let da=a[field]||'',db=b[field]||'';if(!da&&!db)return 0;if(!da)return -1;if(!db)return 1;return da.localeCompare(db)})}

function r(){
let d=D[L];
let c=[d.jb.length,d.ed.length+d.pu.length+d.puDraft.length,d.sw.length+d.ms.length+d.ts.length+d.ct.length,d.pj.length];
let h='<div class="hdr"><div class="hdr-top"><h1>'+t('t')+'</h1><div class="ls"><a href="plan.html" class="lb">'+t('planLink')+'</a><button class="lb '+(L==='fa'?'on':'')+'" onclick="sl(\'fa\')">فارسی</button><button class="lb '+(L==='en'?'on':'')+'" onclick="sl(\'en\')">English</button></div></div></div>';
h+='<div class="sts">';
let icons=['💼','🎓','🛠️',''];
let labels=[t('sec')[1],t('ac'),t('sk'),t('sec')[4]];
for(let i=0;i<c.length;i++)h+='<div class="sc"><div class="sc-icon">'+icons[i]+'</div><div class="sv">'+c[i]+'</div><div class="sl">'+labels[i]+'</div></div>';
h+='</div><div class="tbs">';
for(let i=0;i<t('sec').length;i++)h+='<button class="tb '+(i===0?'on':'')+'" onclick="st('+i+',this)">'+t('sec')[i]+'</button>';
h+='</div>';
h+=rO(d);h+=rJ(d);h+=rA(d);h+=rSK(d);h+=rPJ(d);
document.getElementById('app').innerHTML=h;
}

function rO(d){
let p=d.pe||{};
let fs=[{k:'nm',l:t('lb').nm},{k:'ag',l:t('lb').ag},{k:'gd',l:t('lb').gd},{k:'ct',l:t('lb').ct},{k:'ph',l:t('lb').ph},{k:'em2',l:t('lb').em2},{k:'li',l:t('lb').li},{k:'or',l:t('lb').or},{k:'un',l:t('lb').un},{k:'po',l:t('lb').po}];
let doneProjects=d.pj.filter(p=>p.st==='dn').length;

let h='<div class="sec on" id="s0"><div class="scd"><div class="sh"><div class="st-title">'+t('sec')[0]+' - '+t('pi')+'</div><button class="btn bp" onclick="om(\'pe\')">✏️ '+t('e')+'</button></div><div class="pg">';
for(let i=0;i<fs.length;i++){let f=fs[i];h+='<div class="pi"><label>'+f.l+'</label><div class="v '+(p[f.k]?'':'e')+'">'+(p[f.k]||'—')+'</div></div>'}
h+='</div></div>';

h+='<div class="scd"><div class="st-title" style="margin-bottom:15px">'+t('chartsTitle')+'</div><div class="charts-grid">';

// نمودار ۱: روند رشد در طول زمان (بر اساس تاریخ آیتم‌ها)
let allItems=[];
d.jb.forEach(j=>{if(j.dt)allItems.push({date:j.dt,type:'job'})});
d.ed.forEach(e=>{if(e.sy)allItems.push({date:e.sy,type:'edu'})});
d.pu.forEach(p=>{if(p.sd)allItems.push({date:p.sd,type:'pub'})});
d.puDraft.forEach(p=>{if(p.sd)allItems.push({date:p.sd,type:'draft'})});
d.pj.forEach(p=>{if(p.startDate)allItems.push({date:p.startDate,type:'proj'})});
d.sw.forEach(s=>{if(s.dt)allItems.push({date:s.dt,type:'skill'})});
d.ct.forEach(c=>{if(c.yr)allItems.push({date:c.yr,type:'cert'})});

let growthData=buildGrowthData(allItems);
h+='<div class="chart-card"><h4>'+t('growthChart')+'</h4><div class="chart-wrap">'+renderLineChart(growthData)+'</div></div>';

// نمودار ۲: توزیع مهارت‌ها
let advCount=d.sw.filter(s=>s.lv==='ad').length;
let midCount=d.sw.filter(s=>s.lv==='in').length;
let basCount=d.sw.filter(s=>s.lv==='ba').length;
let totalSkills=advCount+midCount+basCount;

function buildGrowthData(items){
if(items.length===0)return{labels:[],values:[],max:1};
let dates=items.map(i=>i.date).filter(d=>d).sort();
if(dates.length===0)return{labels:[],values:[],max:1};
let uniqueDates=[...new Set(dates)];
let cumulative=0;
let values=[];
uniqueDates.forEach(date=>{
cumulative+=items.filter(i=>i.date===date).length;
values.push(cumulative);
});
return{labels:uniqueDates,values:values,max:Math.max(...values,1)};
}

function renderLineChart(data){
if(data.labels.length===0)return'<div style="color:#718096;font-size:13px">'+t('em')+'</div>';
let w=400,h=180,pad=30;
let maxVal=data.max;
let points=data.values.map((v,i)=>{
let x=pad+(i/(data.labels.length-1||1))*(w-2*pad);
let y=h-pad-(v/maxVal)*(h-2*pad);
return{x,y,v};
});
let pathD=points.map((p,i)=>(i===0?'M':'L')+p.x+','+p.y).join(' ');
let areaD=pathD+' L'+points[points.length-1].x+','+(h-pad)+' L'+points[0].x+','+(h-pad)+' Z';
let svg='<svg viewBox="0 0 '+w+' '+h+'" style="width:100%;height:100%">';
svg+='<defs><linearGradient id="grad1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4a6fa5" stop-opacity="0.3"/><stop offset="100%" stop-color="#4a6fa5" stop-opacity="0.05"/></linearGradient></defs>';
svg+='<path d="'+areaD+'" fill="url(#grad1)"/>';
svg+='<path d="'+pathD+'" fill="none" stroke="#4a6fa5" stroke-width="2.5"/>';
points.forEach(p=>{svg+='<circle cx="'+p.x+'" cy="'+p.y+'" r="4" fill="#4a6fa5"/>';svg+='<text x="'+p.x+'" y="'+(p.y-8)+'" text-anchor="middle" font-size="10" fill="#2d4a73" font-weight="bold">'+p.v+'</text>'});
let labelStep=Math.max(1,Math.floor(data.labels.length/5));
data.labels.forEach((label,i)=>{
if(i%labelStep===0||i===data.labels.length-1){
let x=pad+(i/(data.labels.length-1||1))*(w-2*pad);
svg+='<text x="'+x+'" y="'+(h-5)+'" text-anchor="middle" font-size="8" fill="#718096">'+label.substring(0,7)+'</text>';
}
});
svg+='</svg>';
return svg;
}
