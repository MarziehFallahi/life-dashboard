<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<base target="_top">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Life Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #f8fafc;
  --card: #ffffff;
  --border: #e2e8f0;
  --text: #1e293b;
  --muted: #64748b;
  --accent: #3b82f6;
  --accent-dark: #1d4ed8;
  --success: #10b981;
  --warning: #f59e0b;
  --danger: #ef4444;
  --shadow: 0 1px 3px rgba(0,0,0,0.05);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
}
html, body { direction: rtl; text-align: right; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  padding: 20px;
  min-height: 100vh;
}
body.en { direction: ltr; text-align: left; }
.container { max-width: 1400px; margin: 0 auto; }

/* Header */
.header {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
}
.header h1 { font-size: 24px; font-weight: 700; color: var(--text); }
.lang-switch { display: flex; gap: 8px; }
.lang-btn {
  padding: 8px 16px;
  border: 1px solid var(--border);
  background: var(--card);
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.2s;
}
.lang-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

/* Stats */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}
.stat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  transition: transform 0.2s;
}
.stat-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.stat-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.stat-value { font-size: 28px; font-weight: 700; color: var(--accent); }

/* Charts */
.charts {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 16px;
  margin-bottom: 20px;
}
.chart-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px;
}
.chart-card h3 { font-size: 15px; margin-bottom: 12px; color: var(--text); }
.chart-wrap { position: relative; height: 250px; }

/* Tabs */
.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 20px;
  overflow-x: auto;
}
.tab {
  padding: 8px 16px;
  border: none;
  background: transparent;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  white-space: nowrap;
  transition: all 0.2s;
}
.tab:hover { background: var(--bg); color: var(--text); }
.tab.active { background: var(--accent); color: white; }

/* Section */
.section { display: none; }
.section.active { display: block; }
.section-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 24px;
  margin-bottom: 16px;
}
.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}
.section-title { font-size: 18px; font-weight: 700; }

/* Buttons */
.btn {
  padding: 8px 16px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { background: var(--accent-dark); }
.btn-danger { background: var(--danger); color: white; }
.btn-warning { background: var(--warning); color: white; }
.btn-sm { padding: 5px 10px; font-size: 12px; }

/* Items */
.item {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  margin-bottom: 10px;
  position: relative;
  transition: all 0.2s;
}
.item:hover { border-color: var(--accent); }
.item-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
.item-sub { font-size: 12px; color: var(--muted); }
.item-desc { font-size: 13px; color: var(--text); margin-top: 6px; line-height: 1.5; }
.item-date {
  display: inline-block;
  padding: 3px 10px;
  background: var(--accent);
  color: white;
  border-radius: 12px;
  font-size: 11px;
  margin-top: 6px;
}
.item-actions { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; }
body.en .item-actions { left: auto; right: 10px; }

.badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
  margin: 2px;
}
.badge-blue { background: #dbeafe; color: #1e40af; }
.badge-green { background: #d1fae5; color: #065f46; }
.badge-orange { background: #fed7aa; color: #9a3412; }

/* Progress */
.progress-bar {
  width: 100%;
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
  margin-top: 8px;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--success));
  transition: width 0.3s;
}

/* Timeline */
.timeline { position: relative; padding-right: 30px; }
body.en .timeline { padding-right: 0; padding-left: 30px; }
.timeline::before {
  content: '';
  position: absolute;
  right: 8px;
  top: 0; bottom: 0;
  width: 2px;
  background: var(--border);
}
body.en .timeline::before { right: auto; left: 8px; }
.timeline-item { position: relative; padding-bottom: 20px; }
.timeline-item::before {
  content: '';
  position: absolute;
  right: -26px;
  top: 4px;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--accent);
  border: 3px solid var(--card);
}
body.en .timeline-item::before { right: auto; left: -26px; }

/* Modal */
.modal {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.5);
  z-index: 1000;
  justify-content: center;
  align-items: center;
  padding: 20px;
}
.modal.active { display: flex; }
.modal-content {
  background: var(--card);
  border-radius: 12px;
  padding: 24px;
  max-width: 600px;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.modal-header h3 { font-size: 18px; }
.close-btn { background: none; border: none; font-size: 24px; cursor: pointer; color: var(--muted); }

.form-group { margin-bottom: 14px; }
.form-label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; }
.form-input, .form-textarea, .form-select {
  width: 100%;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
}
.form-input:focus, .form-textarea:focus { outline: none; border-color: var(--accent); }
.form-textarea { min-height: 80px; resize: vertical; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.empty { text-align: center; padding: 40px; color: var(--muted); font-size: 14px; }

/* PDF button */
.pdf-btn {
  position: fixed;
  bottom: 20px;
  left: 20px;
  z-index: 100;
}
body.en .pdf-btn { left: auto; right: 20px; }

@media print {
  .tabs, .btn, .item-actions, .pdf-btn, .modal, .lang-switch { display: none !important; }
  .section { display: block !important; }
}

@media (max-width: 768px) {
  .form-row { grid-template-columns: 1fr; }
  .charts { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="container" id="app"></div>

<div class="modal" id="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalTitle"></h3>
      <button class="close-btn" onclick="closeModal()">×</button>
    </div>
    <div id="modalBody"></div>
    <div style="display:flex; gap:10px; justify-content:flex-end; margin-top:20px; padding-top:15px; border-top:1px solid var(--border);">
      <button class="btn btn-primary" onclick="saveData()" id="saveBtn">ذخیره</button>
      <button class="btn btn-danger" onclick="closeModal()" id="cancelBtn">انصراف</button>
    </div>
  </div>
</div>

<button class="btn btn-primary pdf-btn" onclick="window.print()" id="pdfBtn">📥 PDF</button>

<script>
const T = {
  fa: {
    title: 'داشبورد زندگی و پیشرفت',
    add: 'افزودن', edit: 'ویرایش', delete: 'حذف', save: 'ذخیره', cancel: 'انصراف',
    empty: 'هنوز موردی اضافه نشده است. روی "افزودن" کلیک کنید.',
    confirm: 'آیا مطمئن هستید؟',
    progress: 'پیشرفت',
    tabs: ['نمای کلی','شغلی','تحصیلات','مهارت‌ها','کتاب','پادکست','ورزش','پروژه','گواهینامه','اهداف','برنامه','تایم‌لاین'],
    stats: ['شغل','تحصیل','مهارت','کتاب','پادکست','ورزش','پروژه','گواهینامه','هدف'],
    charts: ['پیشرفت کلی','توزیع مهارت‌ها','کتاب‌های ماهانه','پیشرفت اهداف'],
    labels: {
      title:'عنوان', company:'شرکت/سازمان', period:'دوره', duration:'مدت', location:'مکان',
      type:'نوع', desc:'توضیحات', date:'تاریخ', degree:'مقطع', field:'رشته',
      university:'دانشگاه', gpa:'معدل', year:'سال', name:'نام', level:'سطح',
      hours:'ساعت', author:'نویسنده', rating:'امتیاز (1-5)', notes:'یادداشت',
      episode:'اپیزود', journal:'ژورنال', status:'وضعیت', frequency:'تعداد در هفته',
      issuer:'صادرکننده', language:'زبان', category:'دسته', target:'هدف',
      deadline:'مهلت', priority:'اولویت', progress:'پیشرفت (%)', startDate:'تاریخ شروع',
      endDate:'تاریخ پایان', hoursPerWeek:'ساعت در هفته', link:'لینک'
    },
    types: { management:'مدیریتی', technical:'فنی', academic:'آکادمیک' },
    levels: { advanced:'پیشرفته', intermediate:'متوسط', basic:'مقدماتی' },
    priorities: { high:'بالا', medium:'متوسط', low:'پایین' },
    statuses: { done:'انجام شده', progress:'در حال انجام', planned:'برنامه‌ریزی شده' }
  },
  en: {
    title: 'Life & Progress Dashboard',
    add: 'Add', edit: 'Edit', delete: 'Delete', save: 'Save', cancel: 'Cancel',
    empty: 'No items yet. Click "Add" to start.',
    confirm: 'Are you sure?',
    progress: 'Progress',
    tabs: ['Overview','Jobs','Education','Skills','Books','Podcasts','Sports','Projects','Certificates','Goals','Plan','Timeline'],
    stats: ['Jobs','Education','Skills','Books','Podcasts','Sports','Projects','Certificates','Goals'],
    charts: ['Overall Progress','Skills Distribution','Monthly Books','Goals Progress'],
    labels: {
      title:'Title', company:'Company', period:'Period', duration:'Duration', location:'Location',
      type:'Type', desc:'Description', date:'Date', degree:'Degree', field:'Field',
      university:'University', gpa:'GPA', year:'Year', name:'Name', level:'Level',
      hours:'Hours', author:'Author', rating:'Rating (1-5)', notes:'Notes',
      episode:'Episode', journal:'Journal', status:'Status', frequency:'Per Week',
      issuer:'Issuer', language:'Language', category:'Category', target:'Target',
      deadline:'Deadline', priority:'Priority', progress:'Progress (%)', startDate:'Start Date',
      endDate:'End Date', hoursPerWeek:'Hours/Week', link:'Link'
    },
    types: { management:'Management', technical:'Technical', academic:'Academic' },
    levels: { advanced:'Advanced', intermediate:'Intermediate', basic:'Basic' },
    priorities: { high:'High', medium:'Medium', low:'Low' },
    statuses: { done:'Done', progress:'In Progress', planned:'Planned' }
  }
};

const emptyData = {
  fa: { jobs:[], education:[], software:[], mgmtSkills:[], techSkills:[],
    courses:[], books:[], podcasts:[], papers:[], sports:[], certificates:[],
    languages:[], achievements:[], goals:[], monthlyPlan:[], timeline:[] },
  en: { jobs:[], education:[], software:[], mgmtSkills:[], techSkills:[],
    courses:[], books:[], podcasts:[], papers:[], sports:[], certificates:[],
    languages:[], achievements:[], goals:[], monthlyPlan:[], timeline:[] }
};

let lang = 'fa';
let data = null;
let edit = { type:null, idx:null };
let charts = {};

function init() {
  try {
    const s = localStorage.getItem('lifeDash');
    data = s ? JSON.parse(s) : JSON.parse(JSON.stringify(emptyData));
  } catch(e) { data = JSON.parse(JSON.stringify(emptyData)); }
  render();
}

function switchLang(l) {
  lang = l;
  document.body.classList.toggle('en', l==='en');
  document.documentElement.lang = l;
  document.documentElement.dir = l==='fa'?'rtl':'ltr';
  render();
}

function save() {
  try { localStorage.setItem('lifeDash', JSON.stringify(data)); } catch(e){}
}

function t(k) {
  const ks = k.split('.');
  let r = T[lang];
  for (const k of ks) r = r[k];
  return r;
}

function render() {
  const d = data[lang];
  const html = `
    <div class="header">
      <h1>${t('title')}</h1>
      <div class="lang-switch">
        <button class="lang-btn ${lang==='fa'?'active':''}" onclick="switchLang('fa')">فارسی</button>
        <button class="lang-btn ${lang==='en'?'active':''}" onclick="switchLang('en')">English</button>
      </div>
    </div>
    ${renderStats(d)}
    ${renderCharts()}
    ${renderTabs()}
    ${renderSections(d)}
  `;
  document.getElementById('app').innerHTML = html;
  document.getElementById('saveBtn').textContent = t('save');
  document.getElementById('cancelBtn').textContent = t('cancel');
  document.getElementById('pdfBtn').textContent = '📥 ' + (lang==='fa'?'PDF':'PDF');
  setTimeout(drawCharts, 200);
}

function renderStats(d) {
  const counts = [
    d.jobs.length, d.education.length,
    d.software.length+d.mgmtSkills.length+d.techSkills.length,
    d.books.length, d.podcasts.length, d.sports.length,
    d.projects.length, d.certificates.length, d.goals.length
  ];
  return `<div class="stats">${counts.map((c,i)=>`
    <div class="stat-card">
      <div class="stat-label">${t('stats')[i]}</div>
      <div class="stat-value">${c}</div>
    </div>`).join('')}</div>`;
}

function renderCharts() {
  return `<div class="charts">
    <div class="chart-card"><h3>${t('charts')[0]}</h3><div class="chart-wrap"><canvas id="c1"></canvas></div></div>
    <div class="chart-card"><h3>${t('charts')[1]}</h3><div class="chart-wrap"><canvas id="c2"></canvas></div></div>
    <div class="chart-card"><h3>${t('charts')[2]}</h3><div class="chart-wrap"><canvas id="c3"></canvas></div></div>
    <div class="chart-card"><h3>${t('charts')[3]}</h3><div class="chart-wrap"><canvas id="c4"></canvas></div></div>
  </div>`;
}

function renderTabs() {
  return `<div class="tabs">${t('tabs').map((n,i)=>`
    <button class="tab ${i===0?'active':''}" onclick="showTab(${i},this)">${n}</button>`).join('')}</div>`;
}

function renderSections(d) {
  const L = t('labels');
  return `
    <div class="section active" id="s0">
      <div class="section-card">
        <div class="section-header"><div class="section-title">${t('tabs')[0]}</div></div>
        <p style="color:var(--muted); line-height:1.8;">
          ${lang==='fa'?'به داشبورد زندگی و پیشرفت خود خوش آمدید. از تب‌های بالا برای مدیریت حوزه‌های مختلف استفاده کنید. نمودارها به صورت خودکار با افزودن داده به‌روز می‌شوند.':'Welcome to your Life & Progress Dashboard. Use the tabs above to manage different areas. Charts update automatically as you add data.'}
        </p>
      </div>
    </div>
    ${renderJobs(d)}
    ${renderEducation(d)}
    ${renderSkills(d)}
    ${renderBooks(d)}
    ${renderPodcasts(d)}
    ${renderSports(d)}
    ${renderProjects(d)}
    ${renderCertificates(d)}
    ${renderGoals(d)}
    ${renderPlan(d)}
    ${renderTimeline(d)}
  `;
}

function renderJobs(d) {
  return `<div class="section" id="s1">
    <div class="section-card">
      <div class="section-header">
        <div class="section-title">${t('tabs')[1]}</div>
        <button class="btn btn-primary" onclick="openModal('jobs')">+ ${t('add')}</button>
      </div>
      ${d.jobs.length===0?`<div class="empty">${t('empty')}</div>`:
        d.jobs.map((j,i)=>`<div class="item">
          <div class="item-actions">
            <button class="btn btn-warning btn-sm" onclick="openModal('jobs',${i})">${t('edit')}</button>
            <button class="btn btn-danger btn-sm" onclick="del('jobs',${i})">${t('delete')}</button>
          </div>
          <div class="item-title">${j.title||''}</div>
          <div class="item-sub">${j.company||''} | ${j.period||''} | ${j.location||''}</div>
          <span class="badge badge-${j.type==='management'?'green':'blue'}">${t('types')[j.type]||j.type}</span>
          ${j.desc?`<div class="item-desc">${j.desc}</div>`:''}
          ${j.date?`<div class="item-date">${j.date}</div>`:''}
        </div>`).join('')}
    </div>
  </div>`;
}

function renderEducation(d) {
  return `<div class="section" id="s2">
    <div class="section-card">
      <div class="section-header">
        <div class="section-title">${t('tabs')[2]}</div>
        <button class="btn btn-primary" onclick="openModal('education')">+ ${t('add')}</button>
      </div>
      ${d.education.length===0?`<div class="empty">${t('empty')}</div>`:
        d.education.map((e,i)=>`<div class="item">
          <div class="item-actions">
            <button class="btn btn-warning btn-sm" onclick="openModal('education',${i})">${t('edit')}</button>
            <button class="btn btn-danger btn-sm" onclick="del('education',${i})">${t('delete')}</button>
          </div>
          <div class="item-title">${e.degree||''} - ${e.field||''}</div>
          <div class="item-sub">${e.university||''} | ${L.gpa}: ${e.gpa||''} | ${e.year||''}</div>
          ${e.date?`<div class="item-date">${e.date}</div>`:''}
        </div>`).join('')}
    </div>
  </div>`;
}

function renderSkills(d) {
  return `<div class="section" id="s3">
    <div class="section-card">
      <div class="section-header">
        <div class="section-title">${t('tabs')[3]}</div>
        <button class="btn btn-primary" onclick="openModal('software')">+ ${t('add')}</button>
      </div>
      <h4 style="margin:15px 0 10px; font-size:14px; color:var(--accent);">${lang==='fa'?'نرم‌افزارها':'Software'}</h4>
      ${d.software.length===0?`<div class="empty">${t('empty')}</div>`:
        d.software.map((s,i)=>`<div class="item">
          <div class="item-actions">
            <button class="btn btn-warning btn-sm" onclick="openModal('software',${i})">${t('edit')}</button>
            <button class="btn btn-danger btn-sm" onclick="del('software',${i})">${t('delete')}</button>
          </div>
          <div class="item-title">${s.name||''}</div>
          <span class="badge badge-blue">${s.level||''}</span>
          ${s.date?`<div class="item-date">${s.date}</div>`:''}
        </div>`).join('')}
      <h4 style="margin:20px 0 10px; font-size:14px; color:var(--accent);">${lang==='fa'?'مهارت‌های مدیریتی':'Management Skills'}</h4>
      ${d.mgmtSkills.map((s,i)=>`<div class="item">
        <div class="item-actions"><button class="btn btn-danger btn-sm" onclick="del('mgmtSkills',${i})">${t('delete')}</button></div>
        <div class="item-title">${s.skill||''}</div>
      </div>`).join('')}
      <h4 style="margin:20px 0 10px; font-size:14px; color:var(--accent);">${lang==='fa'?'مهارت‌های فنی':'Technical Skills'}</h4>
      ${d.techSkills.map((s,i)=>`<div class="item">
        <div class="item-actions"><button class="btn btn-danger btn-sm" onclick="del('techSkills',${i})">${t('delete')}</button></div>
        <div class="item-title">${s.skill||''}</div>
      </div>`).join('')}
    </div>
  </div>`;
}

function renderBooks(d) {
  const L = t('labels');
  return `<div class="section" id="s4">
    <div class="section-card">
      <div class="section-header">
        <div class="section-title">${t('tabs')[4]}</div>
        <button class="btn btn-primary" onclick="openModal('books')">+ ${t('add')}</button>
      </div>
      ${d.books.length===0?`<div class="empty">${t('empty')}</div>`:
        d.books.map((b,i)=>`<div class="item">
          <div class="item-actions">
            <button class="btn btn-warning btn-sm" onclick="openModal('books',${i})">${t('edit')}</button>
            <button class="btn btn-danger btn-sm" onclick="del('books',${i})">${t('delete')}</button>
          </div>

function drawCharts() {
  Object.values(charts).forEach(c=>{if(c)c.destroy();});
  charts = {};
  const d = data[lang];
  const colors = { accent:'#3b82f6', success:'#10b981', warning:'#f59e0b', danger:'#ef4444', muted:'#94a3b8' };
  const font = lang==='fa'?'Tahoma, sans-serif':'Times New Roman, serif';
  
  // Chart 1: Overall Progress (Radar)
  const c1 = document.getElementById('c1');
  if (c1) {
    charts.c1 = new Chart(c1, {
      type: 'radar',
      data: {
        labels: t('stats').slice(0,7),
        datasets: [{
          data: [
            Math.min(d.jobs.length*10,100),
            Math.min(d.education.length*20,100),
            Math.min((d.software.length+d.mgmtSkills.length+d.techSkills.length)*5,100),
            Math.min(d.books.length*5,100),
            Math.min(d.podcasts.length*10,100),
            Math.min(d.sports.length*20,100),
            Math.min(d.projects.length*10,100)
          ],
          backgroundColor: 'rgba(59,130,246,0.2)',
          borderColor: colors.accent,
          borderWidth: 2,
          pointBackgroundColor: colors.accent
        }]
      },
      options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{labels:{font:{family:font,size:11}}}}, scales:{r:{beginAtZero:true,max:100,ticks:{font:{family:font,size:10}},pointLabels:{font:{family:font,size:11}}}}}
    });
  }
  
  // Chart 2: Skills Distribution
  const c2 = document.getElementById('c2');
  if (c2) {
    const adv = d.software.filter(s=>s.level===t('levels').advanced).length;
    const mid = d.software.filter(s=>s.level===t('levels').intermediate).length;
    const bas = d.software.filter(s=>s.level===t('levels').basic).length;
    charts.c2 = new Chart(c2, {
      type: 'doughnut',
      data: {
        labels: [t('levels').advanced, t('levels').intermediate, t('levels').basic],
        datasets: [{ data:[adv,mid,bas], backgroundColor:[colors.success,colors.warning,colors.muted], borderWidth:0 }]
      },
      options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom',labels:{font:{family:font,size:11}}}}}
    });
  }
  
  // Chart 3: Monthly Books
  const c3 = document.getElementById('c3');
  if (c3) {
    const months = {};
    d.books.forEach(b=>{ if(b.date) months[b.date.substring(0,7)]=(months[b.date.substring(0,7)]||0)+1; });
    const labels = Object.keys(months).sort();
    charts.c3 = new Chart(c3, {
      type: 'bar',
      data: {
        labels: labels.length?labels:[lang==='fa'?'بدون داده':'No data'],
        datasets: [{ label:lang==='fa'?'تعداد کتاب':'Books', data:labels.length?labels.map(l=>months[l]):[0], backgroundColor:colors.accent, borderRadius:6 }]
      },
      options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{labels:{font:{family:font,size:11}}}}, scales:{x:{ticks:{font:{family:font,size:10}}},y:{beginAtZero:true,ticks:{stepSize:1,font:{family:font,size:10}}}}}
    });
  }
  
  // Chart 4: Goals Progress
  const c4 = document.getElementById('c4');
  if (c4) {
    charts.c4 = new Chart(c4, {
      type: 'bar',
      data: {
        labels: d.goals.length?d.goals.map(g=>g.target||''):[lang==='fa'?'بدون هدف':'No goals'],
        datasets: [{ label:'%', data:d.goals.length?d.goals.map(g=>g.progress||0):[0], backgroundColor:colors.success, borderRadius:6 }]
      },
      options: { indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{labels:{font:{family:font,size:11}}}}, scales:{x:{max:100,ticks:{font:{family:font,size:10}}},y:{ticks:{font:{family:font,size:10}}}}}
    });
  }
}

  if (type==='jobs') {

function closeModal() { document.getElementById('modal').classList.remove('active'); }

function saveData() {
  const {type, idx} = edit;
  const d = data[lang];
  const get = id => document.getElementById('f_'+id)?.value || '';
  
  try {
    let obj = {};
    if (type==='jobs') obj = { title:get('title'), company:get('company'), period:get('period'), duration:get('duration'), location:get('location'), type:get('type'), desc:get('desc'), date:get('date') };
    else if (type==='education') obj = { degree:get('degree'), field:get('field'), university:get('university'), gpa:get('gpa'), year:get('year'), date:get('date') };
    else if (type==='software') obj = { name:get('name'), level:get('level'), date:get('date') };
    else if (type==='books') obj = { title:get('title'), author:get('author'), year:get('year'), rating:get('rating'), category:get('category'), notes:get('notes'), date:get('date') };
    else if (type==='podcasts') obj = { title:get('title'), episode:get('episode'), notes:get('notes'), date:get('date') };
    else if (type==='sports') obj = { name:get('name'), frequency:get('frequency'), hoursPerWeek:get('hoursPerWeek'), notes:get('notes'), date:get('date') };
    else if (type==='projects') obj = { title:get('title'), year:get('year'), category:get('category'), status:get('status'), progress:parseInt(get('progress'))||0, desc:get('desc'), date:get('date') };
    else if (type==='certificates') obj = { name:get('name'), issuer:get('issuer'), year:get('year'), date:get('date'), link:get('link') };
    else if (type==='goals') obj = { target:get('target'), category:get('category'), deadline:get('deadline'), priority:get('priority'), progress:parseInt(get('progress'))||0 };
    else if (type==='monthlyPlan') obj = { title:get('title'), category:get('category'), priority:get('priority'), status:get('status'), notes:get('notes') };
    else if (type==='timeline') obj = { title:get('title'), category:get('category'), date:get('date'), desc:get('desc') };
    
    if (idx!==null) d[type][idx] = obj; else d[type].push(obj);
    save(); render(); closeModal();
  } catch(e) { alert('Error: '+e.message); }
}

function del(type, idx) {
  if (!confirm(t('confirm'))) return;
  data[lang][type].splice(idx,1);
  save(); render();
}
